<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SourceWeft</title>
    <style>
      :root { --bg: #ffffff; --fg: #171717; --muted: #737373; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #171717; --fg: #fafafa; --muted: #a3a3a3; }
      }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: var(--fg); }
      .bar { width: 44px; height: 3px; border-radius: 2px; background: var(--muted); opacity: .35; overflow: hidden; position: relative; }
      .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--fg);
        animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div>SourceWeft</div>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
  </body>
</html>
