<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SourceWeft</title>
    <!-- Shown while the web app loads. Without viewport-fit=cover the viewport runs from
         below the status bar to the bottom of the screen, as it does for the web app's own
         launch cover, and LaunchScreen.storyboard centres its logo in that same span, so
         the three hand over without the logo moving. If loading takes a while it says
         so; if it fails (the app opens this page as #failed), it offers a retry. -->
    <style>
      :root { --bg: #ffffff; --fg: #000000; --muted: #737373; --logo-bg: #0a0a0a; --logo-fg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #171717; --fg: #ffffff; --muted: #a3a3a3; --logo-bg: #fafafa; --logo-fg: #171717; }
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; user-select: none; }
      .mark { position: fixed; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); }
      .mark rect { fill: var(--logo-bg); }
      .mark path { fill: var(--logo-fg); }
      .below { position: fixed; left: 24px; right: 24px; top: calc(50% + 52px);
        display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
      .bar { width: 44px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 35%, transparent);
        overflow: hidden; position: relative; opacity: 0; animation: appear .2s ease-out .4s forwards; }
      .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--fg);
        animation: slide 1.1s ease-in-out infinite; }
      .status { font-size: 14px; line-height: 20px; color: var(--muted); min-height: 20px; }
      button { font: inherit; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--fg);
        border: 0; border-radius: 999px; padding: 10px 22px; }
      [hidden] { display: none !important; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes appear { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 800 800" role="img" aria-label="SourceWeft"><rect width="800" height="800" rx="150"/><path transform="translate(108 108) scale(0.73)" d="M766.6 125.674h-83.275L624.072 376.14l48.525 141.407zM436.545 256.192h-80.873l128.916 418.137h32.83l24.822-86.477zm88.88 0-24.662 85.677 102.492 332.46h34.751l19.698-86.477-104.094-331.66zm-129.717-33.63v-96.888H200.813q-88.238.16-128.115 41.958Q31.86 209.59 33.462 274.128t42.6 95.446q31.068 23.38 75.268 48.205l106.814 56.53q46.282 25.143 38.275 62.937-8.167 37.634-57.172 39.556H36.185v97.527h215.073q48.202-2.562 81.674-22.902 53.168-32.51 65.178-101.371 10.89-93.843-76.709-148.934-111.3-61.015-165.909-99.45-27.545-19.377-18.897-47.724 9.449-31.388 58.933-31.388h200.18z"/></svg>
    <div class="below">
      <div class="bar" id="bar" role="progressbar" aria-label="Loading"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <button id="retry" type="button" hidden></button>
    </div>
    <script>
      (() => {
        const zh = (navigator.language || "").toLowerCase().startsWith("zh");
        const tw = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "");
        const text = {
          slow: zh ? (tw ? "網路較慢，正在連線…" : "网络较慢，正在连接…") : "Slow connection, still connecting…",
          offline: zh ? (tw ? "目前沒有網路連線" : "当前没有网络连接") : "You're offline",
          failed: zh ? (tw ? "無法連線到 SourceWeft" : "无法连接到 SourceWeft") : "Can't reach SourceWeft",
          retry: zh ? (tw ? "重試" : "重试") : "Try again",
        };
        const SLOW_MS = 3000;
        const FAILED_MS = 15000;
        const bar = document.getElementById("bar");
        const status = document.getElementById("status");
        const retry = document.getElementById("retry");
        retry.textContent = text.retry;
        let timers = [];

        const show = (message, canRetry) => {
          status.textContent = message;
          retry.hidden = !canRetry;
          bar.hidden = canRetry;
        };
        const start = () => {
          timers.forEach(clearTimeout);
          show("", false);
          if (!navigator.onLine) {
            show(text.offline, true);
            return;
          }
          timers = [
            setTimeout(() => show(text.slow, false), SLOW_MS),
            setTimeout(() => show(text.failed, true), FAILED_MS),
          ];
        };
        const relaunch = () => {
          start();
          const invoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
          if (invoke) invoke("retry_launch").catch(() => show(text.failed, true));
        };

        retry.addEventListener("click", relaunch);
        if (location.hash === "#failed") {
          show(navigator.onLine ? text.failed : text.offline, true);
          window.addEventListener("online", relaunch);
          return;
        }
        window.addEventListener("online", relaunch);
        window.addEventListener("offline", () => show(text.offline, true));
        start();
      })();
    </script>
  </body>
</html>
