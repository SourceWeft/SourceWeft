[package]
name = "sourceweft-desktop"
version = "0.1.0"
description = "SourceWeft desktop app"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[features]
default = []

[patch.crates-io]
# GTK 0.18 compatibility backport of RUSTSEC-2024-0429; provenance in third_party/rust.
glib = { path = "../../../third_party/rust/glib-0.18.5" }
