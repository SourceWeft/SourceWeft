<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{subject}}</title>
    <style>
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }
      a {
        color: #374151;
      }
      p,
      li {
        font-size: 15px;
        line-height: 26px;
        color: #374151;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 20px;
      }
      @media only screen and (max-width: 600px) {
        .outer {
          padding: 20px 12px !important;
        }
        .content {
          padding: 28px 22px !important;
        }
        h1 {
          font-size: 24px !important;
          line-height: 32px !important;
        }
      }
      @media (prefers-color-scheme: dark) {
        body,
        .canvas {
          background: #111111 !important;
        }
        .card {
          background: #1b1b1b !important;
          border-color: #363636 !important;
        }
        h1,
        .brand {
          color: #f9fafb !important;
        }
        p,
        li,
        a,
        pre {
          color: #d1d5db !important;
        }
        .muted,
        .footer,
        .footer a {
          color: #9ca3af !important;
        }
        .otp-code {
          background: #262626 !important;
          color: #f9fafb !important;
          border-color: #404040 !important;
        }
        .button-cell,
        .button {
          background: #f3f4f6 !important;
          color: #111827 !important;
        }
        .footer {
          border-color: #363636 !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f6f7f8;
      color: #111827;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
        &quot;Microsoft YaHei&quot;, sans-serif;
    "
  >
    <div
      data-mail-preview="true"
      style="
        display: none;
        font-size: 1px;
        line-height: 1px;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
      "
    >
      {{preview}}
    </div>
    <table
      role="presentation"
      class="canvas"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 100%; background: #f6f7f8"
    >
      <tr>
        <td class="outer" align="center" style="padding: 48px 16px">
          <!--[if mso]><table role="presentation" width="560" align="center"><tr><td><![endif]-->
          <table
            role="presentation"
            class="card"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 12px;
            "
          >
            <tr>
              <td class="content" style="padding: 36px 40px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin-bottom: 32px"
                >
                  <tr>
                    <td style="vertical-align: middle; padding-right: 12px">
                      <img
                        src="{{imageUrl}}"
                        width="32"
                        height="32"
                        alt=""
                        style="display: block; border: 0; border-radius: 8px"
                      />
                    </td>
                    <td
                      class="brand"
                      style="
                        vertical-align: middle;
                        color: #111827;
                        font-size: 16px;
                        font-weight: 700;
                        letter-spacing: -0.3px;
                      "
                    >
                      {{siteName}}
                    </td>
                  </tr>
                </table>
                <h1
                  style="
                    margin: 0 0 24px;
                    color: #111827;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: -0.6px;
                    line-height: 36px;
                  "
                >
                  {{heading}}
                </h1>
                {{{bodyHtml}}} {{{actionHtml}}}
                <div
                  class="footer"
                  style="
                    margin-top: 32px;
                    padding-top: 20px;
                    border-top: 1px solid #e5e7eb;
                    color: #6b7280;
                    font-size: 12px;
                    line-height: 20px;
                  "
                >
                  {{siteName}} &middot;
                  <a
                    href="{{baseUrl}}"
                    style="color: #6b7280; text-decoration: underline"
                    >{{baseUrlLabel}}</a
                  >
                </div>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
