<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{subject}}</title>
    <style>
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }

      body {
        background: #ffffff;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
      }

      a {
        color: #111827;
      }

      .wrapper {
        margin: 0 auto;
        max-width: 520px;
        padding: 40px 16px;
      }

      .card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 28px;
      }

      .logo {
        border-radius: 999px;
        display: block;
        height: 40px;
        margin: 0 auto 28px;
        width: 40px;
      }

      h1 {
        color: #111827;
        font-size: 24px;
        line-height: 32px;
        margin: 0 0 24px;
        text-align: center;
      }

      p,
      li {
        color: #374151;
        font-size: 14px;
        line-height: 24px;
      }

      ol,
      ul {
        margin: 0 0 16px;
        padding-left: 22px;
      }

      .action {
        margin: 32px 0;
        text-align: center;
      }

      .button {
        background: #111827;
        border-radius: 6px;
        color: #ffffff !important;
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        padding: 12px 20px;
        text-decoration: none;
      }

      .footer {
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 12px;
        line-height: 20px;
        margin-top: 28px;
        padding-top: 20px;
      }

      .footer a {
        color: #6b7280;
        text-decoration: none;
      }

      .lead {
        color: #111827;
        font-size: 15px;
        line-height: 26px;
      }

      .pillar-list {
        margin: 18px 0;
        padding: 0;
      }

      .pillar-list li {
        border-left: 3px solid #111827;
        list-style: none;
        margin: 0 0 12px;
        padding-left: 12px;
      }

      .link-row {
        margin: 24px 0 6px;
      }

      .link-row a {
        color: #111827;
        font-size: 13px;
        font-weight: 600;
        margin-right: 14px;
        text-decoration: none;
      }

      .signature {
        margin-top: 26px;
      }

      .otp-code {
        color: #111827;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 6px;
        line-height: 40px;
        margin: 20px 0;
        text-align: center;
      }

      .muted {
        color: #6b7280;
        font-size: 12px;
        line-height: 20px;
      }

      pre {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        color: #111827;
        font-size: 12px;
        line-height: 18px;
        overflow-x: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #000000 !important;
          color: #f9fafb !important;
        }

        .card {
          border-color: #333333 !important;
        }

        h1,
        a {
          color: #f9fafb !important;
        }

        p,
        li,
        pre,
        .lead,
        .otp-code {
          color: #d1d5db !important;
        }

        .pillar-list li {
          border-color: #d1d5db !important;
        }

        .button {
          background: #262626 !important;
          color: #ffffff !important;
        }

        .footer {
          border-color: #333333 !important;
          color: #9ca3af !important;
        }

        .footer a {
          color: #9ca3af !important;
        }
      }
    </style>
  </head>
  <body>
    <div data-mail-preview="true" style="display: none; max-height: 0; overflow: hidden;">
      {{preview}}
    </div>
    <div class="wrapper">
      <div class="card">
        <img class="logo" src="{{imageUrl}}" width="40" height="40" alt="{{siteName}}" />
        <h1>{{heading}}</h1>
        {{{bodyHtml}}}
        {{{actionHtml}}}
        <div class="footer">
          {{siteName}}
          <a href="{{baseUrl}}">{{baseUrlLabel}}</a>
        </div>
      </div>
    </div>
  </body>
</html>
