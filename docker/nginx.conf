map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  client_max_body_size 64m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sourceweft_api http://api:3001;
  set $sourceweft_web http://web:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
  location /v1/ { proxy_pass $sourceweft_api; }
  location /api/auth/ { proxy_pass $sourceweft_api; }
  location /.well-known/ { proxy_pass $sourceweft_api; }
  location / { proxy_pass $sourceweft_web; }
}
