name: sourceweft

x-sourceweft-env: &sourceweft-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-sourceweft}:${DB_PASSWORD:-sourceweft}@postgres:5432/${DB_NAME:-sourceweft}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
  NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace_with_32_plus_char_auth_secret}
  MODEL_GATEWAY_ENCRYPTION_SECRET: ${MODEL_GATEWAY_ENCRYPTION_SECRET:-replace_with_32_plus_char_model_secret}
  MODEL_GATEWAY_GLOBAL_CONFIG_PATH: /app/apps/backend/config/model-gateway.global.json
  PUBLIC_S3_BUCKET: ${PUBLIC_S3_BUCKET:-}
  PUBLIC_S3_REGION: ${PUBLIC_S3_REGION:-auto}
  PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT:-}
  PUBLIC_S3_ACCESS_KEY_ID: ${PUBLIC_S3_ACCESS_KEY_ID:-}
  PUBLIC_S3_SECRET_ACCESS_KEY: ${PUBLIC_S3_SECRET_ACCESS_KEY:-}
  PUBLIC_S3_FORCE_PATH_STYLE: ${PUBLIC_S3_FORCE_PATH_STYLE:-true}
  PUBLIC_S3_BASE_URL: ${PUBLIC_S3_BASE_URL:-}
  NOTION_BLOG_API_KEY: ${NOTION_BLOG_API_KEY:-}
  NOTION_BLOG_DATABASE_ID: ${NOTION_BLOG_DATABASE_ID:-}
  NOTION_BLOG_VERSION: ${NOTION_BLOG_VERSION:-2026-03-11}
  BLOG_ASSET_MAX_BYTES: ${BLOG_ASSET_MAX_BYTES:-15728640}

services:
  postgres:
    image: ${SOURCEWEFT_POSTGRES_IMAGE:-ghcr.io/sourceweft/sourceweft-postgres:17}
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      POSTGRES_USER: ${DB_USER:-sourceweft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sourceweft}
      POSTGRES_DB: ${DB_NAME:-sourceweft}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sourceweft} -d ${DB_NAME:-sourceweft}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: "no"

  api:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:api"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
      BACKEND_API_HOST: 0.0.0.0
      PORT: 3001
      BACKEND_API_PORT: 3001
    ports:
      - "${BACKEND_API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped

  scheduler:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped

  web:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-sourceweft}:${DB_PASSWORD:-sourceweft}@postgres:5432/${DB_NAME:-sourceweft}}
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_GOOGLE_ONE_TAP_ENABLED: ${NEXT_PUBLIC_GOOGLE_ONE_TAP_ENABLED:-false}
      NEXT_PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED: ${NEXT_PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED:-false}
      NEXT_PUBLIC_GOOGLE_MOBILE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_MOBILE_CLIENT_ID:-}
      NEXT_PUBLIC_SOURCEWEFT_SAAS_ENABLED: ${NEXT_PUBLIC_SOURCEWEFT_SAAS_ENABLED:-false}
      NEXT_PUBLIC_BILLING_CHECKOUT_ENABLED: ${NEXT_PUBLIC_BILLING_CHECKOUT_ENABLED:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: sourceweft-postgres
  redis_data:
    name: sourceweft-redis
