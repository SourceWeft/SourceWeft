name: sourceweft

x-sourceweft-env: &sourceweft-env
  NODE_ENV: production
  SOURCEWEFT_COMMERCIAL_ENABLED: ${SOURCEWEFT_COMMERCIAL_ENABLED:-false}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-sourceweft}
  DB_PASSWORD: ${DB_PASSWORD:?Run the configuration initialization command in docker/README.md}
  DB_NAME: ${DB_NAME:-sourceweft}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${PUBLIC_WEB_BASE_URL:-http://localhost:${WEB_PORT:-3000}}}
  INTERNAL_API_BASE_URL: http://api:3001
  S3_BUCKET: ${S3_BUCKET:-sourceweft-uploads}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sourceweft}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Initialize docker/.env first}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Initialize docker/.env first}
  MODEL_GATEWAY_ENCRYPTION_SECRET: ${MODEL_GATEWAY_ENCRYPTION_SECRET:?Initialize docker/.env first}
  MODEL_GATEWAY_GLOBAL_CONFIG_PATH: ${MODEL_GATEWAY_GLOBAL_CONFIG_PATH:-/app/apps/backend/config/model-gateway.global.json}
  OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-true}
  ORCAROUTER_ENABLED: ${ORCAROUTER_ENABLED:-false}
  MCP_ALLOWED_INTERNAL_ORIGINS: "${MCP_ALLOWED_INTERNAL_ORIGINS:-[]}"
  LLM_ALLOWED_INTERNAL_ORIGINS: "${LLM_ALLOWED_INTERNAL_ORIGINS:-[]}"
  MCP_OAUTH_REDIRECT_URL: ${MCP_OAUTH_REDIRECT_URL:-}
  MCP_OAUTH_CLIENT_NAME: ${MCP_OAUTH_CLIENT_NAME:-SourceWeft}
  MCP_OAUTH_CLIENTS: "${MCP_OAUTH_CLIENTS:-[]}"
  PUBLIC_S3_BUCKET: ${PUBLIC_S3_BUCKET:-}
  PUBLIC_S3_REGION: ${PUBLIC_S3_REGION:-auto}
  PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT:-}
  PUBLIC_S3_ACCESS_KEY_ID: ${PUBLIC_S3_ACCESS_KEY_ID:-}
  PUBLIC_S3_SECRET_ACCESS_KEY: ${PUBLIC_S3_SECRET_ACCESS_KEY:-}
  PUBLIC_S3_FORCE_PATH_STYLE: ${PUBLIC_S3_FORCE_PATH_STYLE:-true}
  PUBLIC_S3_BASE_URL: ${PUBLIC_S3_BASE_URL:-}
  # proxy uploads through the API; both modes require the private S3 bucket.
  # direct hands the browser a presigned PUT — faster and keeps files out of the
  # API process, but the bucket must carry a CORS policy allowing PUT from the
  # web origin, so it stays opt-in.
  SOURCE_UPLOAD_MODE: ${SOURCE_UPLOAD_MODE:-proxy}
  DOCUMENT_PARSE_OCR_ENABLED: ${DOCUMENT_PARSE_OCR_ENABLED:-false}
  DOCUMENT_PARSE_OCR_PROVIDER: ${DOCUMENT_PARSE_OCR_PROVIDER:-pdf2markdown}
  DOCUMENT_PARSE_IMAGE_STRATEGY: ${DOCUMENT_PARSE_IMAGE_STRATEGY:-vision}
  DOCUMENT_PARSE_DEFAULT_PARSER_VERSION: ${DOCUMENT_PARSE_DEFAULT_PARSER_VERSION:-v4-anydoc-unified-0.2.4}
  NOTION_BLOG_API_KEY: ${NOTION_BLOG_API_KEY:-}
  NOTION_BLOG_DATABASE_ID: ${NOTION_BLOG_DATABASE_ID:-}
  NOTION_BLOG_VERSION: ${NOTION_BLOG_VERSION:-2026-03-11}
  GMAIL_CONNECTOR_ENABLED: ${GMAIL_CONNECTOR_ENABLED:-false}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
  BLOG_ASSET_MAX_BYTES: ${BLOG_ASSET_MAX_BYTES:-15728640}
  SOURCEWEFT_SANDBOX_ENABLED: ${SOURCEWEFT_SANDBOX_ENABLED:-false}
  SOURCEWEFT_SANDBOX_TOOL_APPROVAL_ENABLED: ${SOURCEWEFT_SANDBOX_TOOL_APPROVAL_ENABLED:-false}
  SOURCEWEFT_SANDBOX_PROVIDER: ${SOURCEWEFT_SANDBOX_PROVIDER:-daytona}
  SOURCEWEFT_SANDBOX_TTL_SECONDS: ${SOURCEWEFT_SANDBOX_TTL_SECONDS:-3600}
  SOURCEWEFT_SANDBOX_COMMAND_TIMEOUT_MS: ${SOURCEWEFT_SANDBOX_COMMAND_TIMEOUT_MS:-120000}
  SOURCEWEFT_SANDBOX_MAX_OUTPUT_CHARS: ${SOURCEWEFT_SANDBOX_MAX_OUTPUT_CHARS:-80000}
  SOURCEWEFT_SANDBOX_MAX_PREPARE_FILE_BYTES: ${SOURCEWEFT_SANDBOX_MAX_PREPARE_FILE_BYTES:-10485760}
  SOURCEWEFT_SANDBOX_MAX_PREPARE_TOTAL_BYTES: ${SOURCEWEFT_SANDBOX_MAX_PREPARE_TOTAL_BYTES:-26214400}
  SOURCEWEFT_SANDBOX_MAX_COLLECT_FILE_BYTES: ${SOURCEWEFT_SANDBOX_MAX_COLLECT_FILE_BYTES:-26214400}
  SOURCEWEFT_SANDBOX_MAX_COLLECT_TOTAL_BYTES: ${SOURCEWEFT_SANDBOX_MAX_COLLECT_TOTAL_BYTES:-52428800}
  DAYTONA_API_URL: ${DAYTONA_API_URL:-}
  DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
  DAYTONA_SANDBOX_SNAPSHOT: ${DAYTONA_SANDBOX_SNAPSHOT:-}
  DAYTONA_SANDBOX_IMAGE: ${DAYTONA_SANDBOX_IMAGE:-}

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_PORT:-3000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  storage:
    image: ${SOURCEWEFT_STORAGE_IMAGE:-chrislusf/seaweedfs:4.46}
    profiles: [local-storage]
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sourceweft}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Initialize docker/.env first}
    volumes:
      - storage_data:/data
    restart: unless-stopped

  storage-init:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    command: ["node", "apps/backend/scripts/storage-init.mjs"]
    env_file:
      - path: .env
        required: true
    environment:
      <<: *sourceweft-env
    depends_on:
      storage:
        condition: service_started
        required: false
    restart: "no"

  postgres:
    image: ${SOURCEWEFT_POSTGRES_IMAGE:-ghcr.io/sourceweft/sourceweft-postgres:17}
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      POSTGRES_USER: ${DB_USER:-sourceweft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Initialize docker/.env first}
      POSTGRES_DB: ${DB_NAME:-sourceweft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${DB_USER:-sourceweft} -d ${DB_NAME:-sourceweft}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Require the final TCP server, not initdb's temporary Unix-only server.
      # Fresh volumes can take over a minute to initialize on Docker Desktop.
      start_period: 120s

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: "no"

  api:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:api"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
      BACKEND_API_HOST: 0.0.0.0
      PORT: 3001
      BACKEND_API_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/v1/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped

  scheduler:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    command: ["pnpm", "--filter", "@sourceweft/backend", "start:scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped

  web:
    image: ${SOURCEWEFT_IMAGE:-ghcr.io/sourceweft/sourceweft:latest}
    pull_policy: missing
    env_file:
      - path: .env
        required: false
    environment:
      <<: *sourceweft-env
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PUBLIC_GOOGLE_ONE_TAP_ENABLED: ${PUBLIC_GOOGLE_ONE_TAP_ENABLED:-false}
      PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID: ${PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID:-}
      PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED: ${PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 1m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    # Existing installations: see the explicit legacy-volume override.
  redis_data:
    # Project-scoped by default.
  storage_data: {}
