[package]
name = "swlazy"
version = "0.4.0"
edition = "2021"
description = "Experiment: on-demand loading of a sandbox volume (FUSE read-through fs, and seccomp-notify placeholder hydration)"

[dependencies]
swvol-core = { path = "../swvol-core" }
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
fuser = { version = "=0.15.1", default-features = false, features = ["abi-7-31"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
