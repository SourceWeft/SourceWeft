[package]
name = "swvol-supervisor"
version = "0.3.0"
edition = "2021"
description = "Protected PID-namespace workload supervisor for SourceWeft volume lifecycle"

[dependencies]
anyhow = "1"
blake3 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
