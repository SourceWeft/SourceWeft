name: Sandbox Security Regression

on:
  pull_request:
    paths:
      - "docker/sourceweft-sandbox/**"
      - "packages/sandbox-provider-cloudflare/bridge/Dockerfile"
      - "packages/builtin-skill-html/**"
      - "packages/builtin-skill-html-slides/**"
      - "packages/builtin-skill-report/**"
      - "scripts/ci/verify-report-generation.sh"
      - "scripts/ci/verify-sandbox-security.sh"
      - ".github/workflows/sandbox-security.yml"
  push:
    branches: [main]
    paths:
      - "docker/sourceweft-sandbox/**"
      - "packages/sandbox-provider-cloudflare/bridge/Dockerfile"
      - "packages/builtin-skill-report/**"
      - "scripts/ci/verify-report-generation.sh"
      - "scripts/ci/verify-sandbox-security.sh"
      - ".github/workflows/sandbox-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Sandbox security (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: daytona
            dockerfile: docker/sourceweft-sandbox/Dockerfile
          - provider: cloudflare
            dockerfile: packages/sandbox-provider-cloudflare/bridge/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = x86_64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/sourceweft-sandbox
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: sourceweft-sandbox-security:${{ matrix.provider }}
          cache-from: type=gha,scope=sandbox-security-${{ matrix.provider }}
          cache-to: type=gha,mode=max,scope=sandbox-security-${{ matrix.provider }}
      - name: Verify fixed libraries and offline HTML as the image user
        run: |
          docker run --rm --network none --ipc=host --entrypoint bash \
            --mount type=bind,source="$PWD/packages/builtin-skill-html",target=/skills/html,readonly \
            --mount type=bind,source="$PWD/packages/builtin-skill-html-slides",target=/skills/html-slides,readonly \
            --mount type=bind,source="$PWD/scripts/ci/verify-sandbox-security.sh",target=/tmp/verify-security.sh,readonly \
            sourceweft-sandbox-security:${{ matrix.provider }} /tmp/verify-security.sh

      - name: Verify offline reports and source revisions as the image user
        run: |
          set -euo pipefail
          report_container_id=$(docker create --network none --ipc=host --entrypoint bash \
            --mount type=bind,source="$PWD/packages/builtin-skill-report",target=/skills/report,readonly \
            --mount type=bind,source="$PWD/scripts/ci/verify-report-generation.sh",target=/tmp/verify-reports.sh,readonly \
            sourceweft-sandbox-security:${{ matrix.provider }} /tmp/verify-reports.sh /workspace/report-qualification)
          cleanup_report_container() {
            mkdir -p "output/reports/${{ matrix.provider }}"
            docker cp "$report_container_id:/workspace/report-qualification/." "output/reports/${{ matrix.provider }}/" || true
            docker rm -f "$report_container_id" > /dev/null
          }
          trap cleanup_report_container EXIT
          docker start --attach "$report_container_id"
      - name: Retain public report examples and review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-qualification-${{ matrix.provider }}
          if-no-files-found: warn
          path: |
            output/reports/${{ matrix.provider }}/original/report.html
            output/reports/${{ matrix.provider }}/original/report.md
            output/reports/${{ matrix.provider }}/original/report.docx
            output/reports/${{ matrix.provider }}/original/report.pdf
            output/reports/${{ matrix.provider }}/original/verification.json
            output/reports/${{ matrix.provider }}/original/qa/*.jpg
            output/reports/${{ matrix.provider }}/original/pdf-pages/*.png
            output/reports/${{ matrix.provider }}/revised/report.html
            output/reports/${{ matrix.provider }}/revised/report.md
            output/reports/${{ matrix.provider }}/revised/report.docx
            output/reports/${{ matrix.provider }}/revised/report.pdf
            output/reports/${{ matrix.provider }}/revised/verification.json
            output/reports/${{ matrix.provider }}/revised/qa/*.jpg
            output/reports/${{ matrix.provider }}/revised/pdf-pages/*.png
            output/reports/${{ matrix.provider }}/long-table/report.html
            output/reports/${{ matrix.provider }}/long-table/report.md
            output/reports/${{ matrix.provider }}/long-table/report.docx
            output/reports/${{ matrix.provider }}/long-table/report.pdf
            output/reports/${{ matrix.provider }}/long-table/verification.json
            output/reports/${{ matrix.provider }}/long-table/native-layout.json
            output/reports/${{ matrix.provider }}/long-table/qa/qa.json
            output/reports/${{ matrix.provider }}/long-table/qa/*.jpg
            output/reports/${{ matrix.provider }}/long-table/pdf-pages/*.png
            output/reports/${{ matrix.provider }}/long-table-revised/report.html
            output/reports/${{ matrix.provider }}/long-table-revised/report.md
            output/reports/${{ matrix.provider }}/long-table-revised/report.docx
            output/reports/${{ matrix.provider }}/long-table-revised/report.pdf
            output/reports/${{ matrix.provider }}/long-table-revised/verification.json
            output/reports/${{ matrix.provider }}/long-table-revised/native-layout.json
            output/reports/${{ matrix.provider }}/long-table-revised/qa/qa.json
            output/reports/${{ matrix.provider }}/long-table-revised/qa/*.jpg
            output/reports/${{ matrix.provider }}/long-table-revised/pdf-pages/*.png
            output/reports/${{ matrix.provider }}/oversize/qa/qa.json
            output/reports/${{ matrix.provider }}/navigation-negative/content-verification.json
