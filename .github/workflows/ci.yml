name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types

  test:
    name: Tests
    needs: lint-and-type
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/${{ github.repository }}-postgres:17
        env:
          POSTGRES_USER: sourceweft
          POSTGRES_PASSWORD: sourceweft
          POSTGRES_DB: sourceweft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - run: pnpm install --frozen-lockfile
      - name: Run backend tests
        run: pnpm --filter @sourceweft/backend test
        env:
          DATABASE_URL: postgresql://sourceweft:sourceweft@localhost:5432/sourceweft
          REDIS_URL: redis://localhost:6379/0
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars
          MODEL_GATEWAY_ENCRYPTION_SECRET: ci-test-model-secret-at-least-32
      - name: Run web tests
        run: pnpm --filter web test

  docker-build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sourceweft:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
