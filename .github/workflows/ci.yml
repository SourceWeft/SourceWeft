name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA on main to check and publish (7–40 hex characters)"
        required: true
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  revision:
    name: Resolve source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate source commit
        id: resolve
        shell: bash
        env:
          SELECTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Run manual image publication from the main workflow branch."
              exit 1
            fi
            if [[ ! "$SELECTED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::Provide a commit SHA containing 7–40 hexadecimal characters."
              exit 1
            fi
            sha=$(git rev-parse --verify "${SELECTED_COMMIT}^{commit}")
            if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
              echo "::error::The selected commit must belong to main."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source commit: $sha" >> "$GITHUB_STEP_SUMMARY"

  update-signatures:
    needs: revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo build --locked --manifest-path scripts/ci/update-verifier/Cargo.toml
      - run: node --test scripts/ci/desktop-update-signatures.test.mjs
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/debug/sourceweft-update-verifier
  lint-and-type:
    needs: revision
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-${{ needs.revision.outputs.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22.23.2-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-node22.23.2-
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - name: Verify manual image workflow when present in selected revision
        if: hashFiles('scripts/ci/manual-image-workflow.test.mjs') != ''
        run: node --test scripts/ci/manual-image-workflow.test.mjs
      - run: node --test scripts/ci/verify-release-config.test.mjs scripts/ci/publish-downloads.test.mjs scripts/ci/publish-desktop-updates.test.mjs scripts/ci/desktop-update-manifest.test.mjs docker/selfhost-config.test.mjs
      - run: pnpm lint
      - run: pnpm check-types

  test:
    name: Tests (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.18.0"]
    needs: [revision, lint-and-type]
    runs-on: ubuntu-latest
    services:
      postgres:
        # Hardcoded lowercase: github.repository is SourceWeft/SourceWeft and
        # Docker rejects uppercase repository names; expressions have no lower().
        image: ghcr.io/sourceweft/sourceweft-postgres:17
        env:
          POSTGRES_USER: sourceweft
          POSTGRES_PASSWORD: sourceweft
          POSTGRES_DB: sourceweft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ needs.revision.outputs.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-node${{ matrix.node }}-
      - run: pnpm install --frozen-lockfile
      # DB-backed suites query real tables; the service container starts from
      # a bare image, so the schema has to be applied first.
      - name: Run database migrations
        run: pnpm --filter @sourceweft/backend db:migrate
        env:
          DATABASE_URL: postgresql://sourceweft:sourceweft@localhost:5432/sourceweft
          REDIS_URL: redis://localhost:6379/0
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars
          MODEL_GATEWAY_ENCRYPTION_SECRET: ci-test-model-secret-at-least-32
      - name: Verify patched npm dependency behavior
        run: |
          node scripts/ci/verify-security-dependencies.cjs
          node scripts/ci/verify-security-patches.mjs
      # Runs every workspace package that defines a `test` script, not just
      # backend and web. Package-level suites (contracts, model-gateway,
      # builtin-*) were previously never executed in CI, so breakage there
      # stayed invisible until someone ran them by hand.
      - name: Run tests
        run: pnpm test --force
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://sourceweft:sourceweft@localhost:5432/sourceweft
          REDIS_URL: redis://localhost:6379/0
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars
          MODEL_GATEWAY_ENCRYPTION_SECRET: ci-test-model-secret-at-least-32
          # parsers.test.ts drives the OCR fallback through the real provider
          # module, whose config demands a key at load; locally .env supplies
          # it. Any non-empty value works — requests are mocked.
          PDF2MARKDOWN_API_KEY: ci-test-pdf2markdown-key

  cli-cross-platform:
    # The CLI writes files into people's home directories on their own machines,
    # so it is exercised on every OS it will run on, and on the oldest Node it
    # claims to support. Windows starts non-blocking: path and reserved-name
    # handling has only ever been run on macOS and Linux, so its first runs are
    # information. Make it blocking once it has been green.
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [revision, lint-and-type]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20.x"
          - os: macos-latest
            node: "24.18.0"
          - os: windows-latest
            node: "24.18.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter "@sourceweft/cli..."
      - run: pnpm --filter @sourceweft/skill-format test
      - run: pnpm --filter @sourceweft/cli test
      - run: pnpm --filter @sourceweft/cli build
      - name: Smoke-test the built binary
        run: |
          node cli/dist/main.js --version
          node cli/dist/main.js skills agents

  docker-build:
    name: Docker Build
    needs: [revision, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ghcr.io/sourceweft/sourceweft-postgres:17
        env:
          POSTGRES_USER: sourceweft
          POSTGRES_PASSWORD: sourceweft
          POSTGRES_DB: sourceweft_ci_startup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require native amd64 runner
        run: test "$(uname -m)" = x86_64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sourceweft:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify documented Compose installation and restart
        run: node scripts/ci/verify-selfhost-compose.mjs sourceweft:pr-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhost-compose-${{ needs.revision.outputs.sha }}
          path: |
            output/ci/selfhost/
            output/selfhost-playwright/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check production image entrypoints
        run: node scripts/ci/verify-docker-startup.mjs sourceweft:pr-test
        env:
          DATABASE_URL: postgresql://sourceweft:sourceweft@127.0.0.1:5432/sourceweft_ci_startup
          REDIS_URL: redis://127.0.0.1:6379/0
      - name: Upload image startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-startup-${{ needs.revision.outputs.sha }}
          path: output/ci/docker-startup/
          if-no-files-found: ignore
          retention-days: 7

  html-artifacts:
    needs: revision
    name: HTML runtime and complete library
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r docker/sourceweft-sandbox/html-runtime/requirements.txt
      - uses: actions/cache@v4
        with:
          path: output/html-fonts
          key: html-fonts-${{ hashFiles('docker/sourceweft-sandbox/html-runtime/fonts.json') }}
      - run: python docker/sourceweft-sandbox/html-runtime/install_fonts.py docker/sourceweft-sandbox/html-runtime/fonts.json output/html-fonts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: html-browsers-${{ runner.os }}-1.59.1
      - run: pnpm --filter @sourceweft/builtin-tool-publish-artifact exec playwright install --with-deps chromium firefox webkit
      - name: Verify library, responsive pages and revisions
        env:
          NODE_PATH: ${{ github.workspace }}/packages/builtin-tool-publish-artifact/node_modules
          SOURCEWEFT_HTML_RUNTIME: ${{ github.workspace }}/docker/sourceweft-sandbox/html-runtime
          SOURCEWEFT_HTML_FONTS: ${{ github.workspace }}/output/html-fonts
        run: |
          node packages/builtin-skill-html-slides/scripts/verify-library.cjs output/html-library
          node packages/builtin-skill-html/scripts/verify-pages.cjs output/html-pages
          node packages/builtin-skill-html-slides/scripts/verify-behavior.cjs output/html-behavior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-verification-${{ needs.revision.outputs.sha }}
          path: |
            output/html-library
            output/html-pages
            output/html-behavior
          retention-days: 7

  docker-image-platform:
    name: Docker Image (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      [
        revision,
        update-signatures,
        lint-and-type,
        test,
        cli-cross-platform,
        docker-build,
        html-artifacts,
      ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-image-${{ needs.revision.outputs.sha }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Set image metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SOURCE_SHA-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Require a native architecture runner
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing commit image
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' > manifest.json 2> manifest-error.txt; then
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' manifest.json)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Fxq "ERROR: $IMAGE:$TAG: not found" manifest-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat manifest-error.txt >&2
            exit 1
          fi
      - name: Build and push image
        id: build
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
          build-args: |
            BUILD_SHA=${{ needs.revision.outputs.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.time }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-image-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - name: Verify native runtime and record platform digest
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' > platform-manifest.json
          jq -e --arg arch "$ARCH" '[.manifests[].platform | select(.os=="linux" and .architecture!="unknown") | .architecture] | unique | . == [$arch]' platform-manifest.json
          docker run --rm --network none --entrypoint node "$IMAGE@$DIGEST" -e 'const fs=require("node:fs"); const expected={amd64:"x64",arm64:"arm64"}[process.argv[1]]; if(process.arch!==expected)throw new Error("Wrong runtime architecture"); for(const name of ["api","worker","scheduler","skills-submit"])if(!fs.existsSync("/app/apps/backend/dist/"+name+".js"))throw new Error("Missing entrypoint "+name); console.log("Native runtime verified",process.arch,process.version);' "$ARCH"
          mkdir -p image-digests
          jq -n --arg image "$IMAGE" --arg revision "$SOURCE_SHA" --arg arch "$ARCH" --arg digest "$DIGEST" '{image:$image,revision:$revision,arch:$arch,digest:$digest}' > "image-digests/$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sourceweft-image-digest-${{ matrix.arch }}
          overwrite: true
          path: image-digests/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  docker-image:
    name: Docker Image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      [
        revision,
        update-signatures,
        lint-and-type,
        test,
        cli-cross-platform,
        docker-build,
        html-artifacts,
        docker-image-platform,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-image-${{ needs.revision.outputs.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Set image metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing commit image
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' > manifest.json 2> manifest-error.txt; then
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' manifest.json)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Fxq "ERROR: $IMAGE:$TAG: not found" manifest-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat manifest-error.txt >&2
            exit 1
          fi
      - name: Download native platform digests
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: sourceweft-image-digest-*
          path: image-digests
          merge-multiple: true
      - name: Publish complete multi-platform manifest
        id: build
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(jq -er --arg image "$IMAGE" --arg revision "$SOURCE_SHA" --arg arch "$arch" 'select(.image==$image and .revision==$revision and .arch==$arch) | .digest | select(test("^sha256:[0-9a-f]{64}$"))' "image-digests/$arch.json")
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' > manifest.json
          jq -e '[.manifests[].platform | select(.os=="linux" and .architecture!="unknown") | .architecture] | unique | . == ["amd64","arm64"]' manifest.json
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' manifest.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable image reference
        id: result
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Docker Image"
            echo ""
            echo "Commit: $SOURCE_SHA"
            echo ""
            echo "Tag: $IMAGE:$TAG"
            echo ""
            echo "Deploy by digest: $IMAGE@$DIGEST"
            echo ""
            echo "Publication does not trigger deployment."
          } >> "$GITHUB_STEP_SUMMARY"
