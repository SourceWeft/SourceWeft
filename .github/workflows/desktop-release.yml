name: Desktop update package build
on:
  workflow_call:
    inputs:
      publication_policy:
        type: string
        default: signed
  workflow_dispatch:
    inputs:
      publication_policy:
        description: Explicit signing policy for build-only validation (does not publish)
        type: choice
        options: [signed, updater-signed]
        default: updater-signed
permissions:
  contents: read
  actions: read
jobs:
  build:
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      DESKTOP_RELEASE_TARGET: ${{ matrix.target }}
      SOURCEWEFT_SIGNED_RELEASE: "true"
      DESKTOP_PUBLICATION_POLICY: ${{ inputs.publication_policy }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.publication_policy == 'signed' && secrets.APPLE_TEAM_ID || '' }}
      WINDOWS_TIMESTAMP_URL: ${{ inputs.publication_policy == 'signed' && vars.WINDOWS_TIMESTAMP_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Reuse completed signed artifacts on reruns
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/reuse-desktop-release.mjs
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && steps.existing.outputs.exists != 'true'
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: dtolnay/rust-toolchain@1.94.1
        if: steps.existing.outputs.exists != 'true'
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
        if: steps.existing.outputs.exists != 'true'
      - run: node scripts/ci/verify-desktop-tag.mjs
        if: github.ref_type == 'tag'
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.publication_policy == 'signed' && steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Windows signing credentials are required" }
          $path = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
            $signer = @($cert | Where-Object HasPrivateKey)
            if ($signer.Count -ne 1) { throw "Expected one signing certificate" }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($signer[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - name: Validate release signing configuration
        if: steps.existing.outputs.exists != 'true'
        run: node scripts/ci/desktop-release-config.mjs
      - name: Build installers with required updater signatures
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          if [ "$DESKTOP_PUBLICATION_POLICY" = "updater-signed" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_TIMESTAMP_URL
          fi
          pnpm --filter @sourceweft/desktop exec tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.generated.json -- --locked
      - name: Build signature verifier
        if: steps.existing.outputs.exists != 'true'
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Verify and describe macOS artifacts
        if: runner.os == 'macOS' && steps.existing.outputs.exists != 'true'
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: node scripts/ci/prepare-desktop-release.mjs
      - name: Verify and describe Windows artifacts
        if: runner.os == 'Windows' && steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier.exe
        run: |
          $files = @(Get-ChildItem "apps/desktop/src-tauri/target/$env:DESKTOP_RELEASE_TARGET/release/bundle/nsis/*.exe")
          if ($files.Count -ne 1) { throw "Expected one NSIS installer" }
          $env:UPDATE_VERIFY_INSTALLER = $files[0].FullName
          node scripts/ci/prepare-desktop-release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify and describe Linux artifacts
        if: runner.os == 'Linux' && steps.existing.outputs.exists != 'true'
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: node scripts/ci/prepare-desktop-release.mjs
      # Local-execution sandbox runtime. The desktop app downloads it on demand from this release
      # and verifies it (minisign over the whole file with the same updater key, then the
      # manifest + per-file SHA-256), so each leg here builds the runtime for its own target,
      # code-signs it, and minisign-signs the packed tarball with the same key and verifier the
      # installers use. Linux x86_64 ships a static ripgrep and srt's apply-seccomp helper; macOS
      # (both architectures) ships a Mach-O ripgrep and no apply-seccomp, and additionally
      # code-signs the binaries (Developer ID + hardened runtime + entitlements in `signed`,
      # ad-hoc in `updater-signed`) BEFORE the tarball is hashed and minisigned. Windows x86_64 ships a
# PE ripgrep, srt-win.exe and the sidecar as .exe files, and under `signed` Authenticode-signs
# them with the installer's certificate before the tarball is hashed and minisigned; the
# aarch64 Windows bundle has no installer and is built by the `sandbox-bundle-windows-arm64` job
# below on a native arm64 runner.
      - uses: oven-sh/setup-bun@v2
        if: (runner.os == 'Linux' || runner.os == 'macOS' || runner.os == 'Windows') && steps.existing.outputs.exists != 'true'
        with:
          bun-version: 1.4.2
      - name: Build, sign and verify the sandbox runtime bundle (Linux)
        if: runner.os == 'Linux' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: |
          set -euo pipefail
          # Pinned official static ripgrep (scripts/ci/ripgrep-release.json), checksum-verified.
          rg="$(bash scripts/ci/install-static-ripgrep.sh "$RUNNER_TEMP/ripgrep")"
          pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target "$DESKTOP_RELEASE_TARGET" --rg "$rg"
          bundle=sandbox-bundle
          rm -rf "$bundle"
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$bundle"
          tarball="$bundle/sourceweft-sandbox-$DESKTOP_RELEASE_TARGET.tar.gz"
          node scripts/ci/sandbox-bundle.mjs verify "$tarball"
          node scripts/ci/sandbox-bundle.mjs sign "$tarball"
          node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
          cp "$tarball" "$tarball.sig" desktop-release/
      # macOS only: import the Developer ID Application certificate so codesign can find
      # APPLE_SIGNING_IDENTITY when it signs the bare sandbox binaries. The installer's own signing
      # is done inside `tauri build`, which imports this same certificate into its own temporary
      # keychain and does not leave it behind for a later codesign call, so the bundle job needs
      # its own import. Same secrets as the installers; no new secret. Runs only for the `signed`
      # policy (the `updater-signed` path signs ad-hoc and needs no certificate). UNVERIFIED in
      # this repository: no Apple Developer ID certificate is available to the authors, so the
      # Developer ID branch has only ever been exercised against a fake codesign.
      - name: Import the Developer ID certificate for sandbox-bundle signing
        if: runner.os == 'macOS' && inputs.publication_policy == 'signed' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are required for the signed policy"
            exit 1
          fi
          keychain="$RUNNER_TEMP/sandbox-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          rm -f "$cert"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Prepend our keychain to the user search list so codesign resolves the identity.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')
      - name: Build, sign and verify the sandbox runtime bundle (macOS)
        if: runner.os == 'macOS' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: |
          set -euo pipefail
          # Pinned official Mach-O ripgrep for this arch (scripts/ci/ripgrep-release.json),
          # checksum-verified. x86_64-apple-darwin cross-compiles on the arm64 runner as the
          # Tauri installers do.
          rg="$(bash scripts/ci/install-ripgrep-macos.sh "$RUNNER_TEMP/ripgrep" "$DESKTOP_RELEASE_TARGET")"
          pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target "$DESKTOP_RELEASE_TARGET" --rg "$rg"
          # Code-sign the binaries BEFORE packing. signed => Developer ID Application identity
          # (hardened runtime + entitlements + secure timestamp); updater-signed => ad-hoc (`-`),
          # exactly like the installers. sign-macos.sh exits non-zero on any failure (the bundle
          # must then be discarded, which `set -e` does by failing the job).
          if [ "$DESKTOP_PUBLICATION_POLICY" = "signed" ]; then
            identity="$APPLE_SIGNING_IDENTITY"
          else
            identity="-"
          fi
          bash apps/desktop/sandbox-sidecar/scripts/sign-macos.sh apps/desktop/sandbox-sidecar/dist/bundle "$identity"
          # Code-signing rewrote the binaries, so the build-time manifest no longer matches them;
          # rebuild it over the signed files before the tarball is hashed and minisigned.
          pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --remanifest
          bundle=sandbox-bundle
          rm -rf "$bundle"
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$bundle"
          tarball="$bundle/sourceweft-sandbox-$DESKTOP_RELEASE_TARGET.tar.gz"
          node scripts/ci/sandbox-bundle.mjs verify "$tarball"
          node scripts/ci/sandbox-bundle.mjs sign "$tarball"
          node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
          # Signature checks on the signed binaries. --verify --strict is meaningful for both
          # ad-hoc and Developer ID; the Developer ID assertions (codesign authority + a notarized
          # spctl assessment) are UNVERIFIED here (no Apple credentials) and documented as such.
          for file in srt-sidecar rg; do
            codesign --verify --strict --verbose=2 "apps/desktop/sandbox-sidecar/dist/bundle/$file"
            codesign -dvv "apps/desktop/sandbox-sidecar/dist/bundle/$file" 2>&1 | grep -E 'Signature=|Authority=|flags=' || true
          done
          cp "$tarball" "$tarball.sig" desktop-release/
      - name: Install the pinned Windows ripgrep for the sandbox runtime bundle
        id: ripgrep_windows
        if: runner.os == 'Windows' && steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $rg = @(& ./scripts/ci/install-ripgrep-windows.ps1 "$env:RUNNER_TEMP\ripgrep" $env:DESKTOP_RELEASE_TARGET)[-1]
          "path=$rg" >> $env:GITHUB_OUTPUT
      - name: Build, sign and verify the sandbox runtime bundle (Windows)
        if: runner.os == 'Windows' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier.exe
          RG_PATH: ${{ steps.ripgrep_windows.outputs.path }}
        run: bash scripts/ci/build-sandbox-bundle-windows.sh
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: desktop-release-${{ matrix.target }}-${{ github.sha }}
          path: desktop-release/*
          if-no-files-found: error
          retention-days: 30
  # The aarch64 Windows sandbox runtime bundle. The desktop installer is x64-only, so there is no
  # installer, updater package or manifest for this target: the job only builds, signs, packs and
  # uploads sourceweft-sandbox-aarch64-pc-windows-msvc.tar.gz(.sig) beside the other bundles. It
  # builds on a native arm64 runner so the executables it ships are the ones it ran. Its artifact
  # is named like the others (`desktop-release-<target>-<sha>`) so the release workflow's single
  # download pattern picks it up, and so a rerun reuses it the same way.
  sandbox-bundle-windows-arm64:
    name: Sandbox runtime bundle (Windows arm64)
    environment: desktop-release
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      DESKTOP_RELEASE_TARGET: aarch64-pc-windows-msvc
      SOURCEWEFT_SIGNED_RELEASE: "true"
      DESKTOP_PUBLICATION_POLICY: ${{ inputs.publication_policy }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ inputs.publication_policy == 'signed' && vars.WINDOWS_TIMESTAMP_URL || '' }}
      DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Reuse completed signed artifacts on reruns
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/reuse-desktop-release.mjs
      - uses: dtolnay/rust-toolchain@1.94.1
        if: steps.existing.outputs.exists != 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          # bun-v1.4.2 ships bun-windows-aarch64.zip; setup-bun v2 selects it on this runner.
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
        if: steps.existing.outputs.exists != 'true'
      - run: node scripts/ci/verify-desktop-tag.mjs
        if: github.ref_type == 'tag'
      - name: Import Windows signing certificate
        if: inputs.publication_policy == 'signed' && steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Windows signing credentials are required" }
          $path = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
            $signer = @($cert | Where-Object HasPrivateKey)
            if ($signer.Count -ne 1) { throw "Expected one signing certificate" }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($signer[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - name: Build signature verifier
        if: steps.existing.outputs.exists != 'true'
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Install the pinned Windows ripgrep for the sandbox runtime bundle
        id: ripgrep_windows
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $rg = @(& ./scripts/ci/install-ripgrep-windows.ps1 "$env:RUNNER_TEMP\ripgrep" $env:DESKTOP_RELEASE_TARGET)[-1]
          "path=$rg" >> $env:GITHUB_OUTPUT
      - name: Build, sign and verify the sandbox runtime bundle (Windows)
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          RG_PATH: ${{ steps.ripgrep_windows.outputs.path }}
        run: bash scripts/ci/build-sandbox-bundle-windows.sh
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: desktop-release-${{ env.DESKTOP_RELEASE_TARGET }}-${{ github.sha }}
          path: desktop-release/*
          if-no-files-found: error
          retention-days: 30
