name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.config.outputs.latest }}
      prerelease: ${{ steps.config.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Validate release version and production URLs
        id: config
        run: node scripts/ci/verify-release-config.mjs
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WEB_BASE_URL: ${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  desktop:
    needs: preflight
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read

  release:
    needs: [preflight, quality, desktop]
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.latest == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WEB_BASE_URL=${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_ONE_TAP_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_ONE_TAP_ENABLED || 'false' }}
            NEXT_PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ONE_TAP_CLIENT_ID || '' }}
            NEXT_PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_ONE_TAP_FEDCM_ENABLED || 'false' }}
            NEXT_PUBLIC_GOOGLE_MOBILE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_MOBILE_CLIENT_ID || '' }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
