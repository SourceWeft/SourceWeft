name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  DOWNLOADS_S3_ENDPOINT: ${{ vars.DOWNLOADS_S3_ENDPOINT }}
  DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
  DOWNLOADS_S3_REGION: ${{ vars.DOWNLOADS_S3_REGION }}
  DOWNLOADS_S3_FORCE_PATH_STYLE: ${{ vars.DOWNLOADS_S3_FORCE_PATH_STYLE }}
  DOWNLOADS_S3_PREFIX: ${{ vars.DOWNLOADS_S3_PREFIX }}
  DOWNLOADS_PUBLIC_BASE_URL: ${{ vars.DOWNLOADS_PUBLIC_BASE_URL }}
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.config.outputs.latest }}
      prerelease: ${{ steps.config.outputs.prerelease }}
      desktop_policy: ${{ steps.config.outputs.desktop_policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Validate release tag
        id: config
        run: node scripts/ci/verify-release-config.mjs
      - name: Require changelog notes for the tag
        run: node scripts/ci/verify-changelog-entry.mjs
      - name: Validate download storage configuration
        run: node scripts/ci/publish-downloads.mjs validate
        env:
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
      - name: Validate update publication configuration
        if: steps.config.outputs.desktop_policy == 'signed'
        run: node scripts/ci/publish-desktop-updates.mjs validate
        env:
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  desktop:
    needs: preflight
    if: needs.preflight.outputs.desktop_policy == 'signed'
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read

  desktop-candidate:
    needs: preflight
    if: needs.preflight.outputs.desktop_policy == 'candidate'
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read

  release:
    needs: [preflight, quality, desktop, desktop-candidate]
    if: >-
      ${{ !cancelled() && always() && needs.preflight.result == 'success' &&
          needs.quality.result == 'success' &&
          ((needs.preflight.outputs.desktop_policy == 'signed' && needs.desktop.result == 'success') ||
           (needs.preflight.outputs.desktop_policy == 'candidate' && needs.desktop-candidate.result == 'success')) }}
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.desktop_policy == 'signed' && 'desktop-release' || 'desktop-candidate' }}
    env:
      DESKTOP_PUBLICATION_POLICY: ${{ needs.preflight.outputs.desktop_policy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.latest == 'true' }}

      - name: Resolve build metadata
        id: buildmeta
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildmeta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published images support anonymous installation
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          DOCKER_CONFIG="$registry_config" docker manifest inspect "$RELEASE_IMAGE:$RELEASE_TAG" > /dev/null
          DOCKER_CONFIG="$registry_config" docker manifest inspect ghcr.io/sourceweft/sourceweft-postgres:17 > /dev/null

      - name: Package self-hosting instructions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: tar -czf "sourceweft-selfhost-${RELEASE_TAG}.tar.gz" docker/docker-compose.yml docker/nginx.conf docker/.env.example docker/README.md docker/README.zh-CN.md docker/compose.legacy-volumes.yml

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.preflight.outputs.desktop_policy == 'signed' && format('desktop-release-*-{0}', github.sha) || format('desktop-verification-*-{0}', github.sha) }}
          path: release-installers
          merge-multiple: true

      - name: Update GitHub release draft
        id: github_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && needs.preflight.outputs.desktop_policy == 'signed'
        with:
          name: ${{ github.ref_name }}
          draft: true
          files: |
            sourceweft-selfhost-*.tar.gz
            release-installers/**/*.dmg
            release-installers/**/*.exe
            release-installers/**/*.AppImage
            release-installers/**/*.app.tar.gz
            release-installers/**/*.sig
          fail_on_unmatched_files: true
          body: |
            Self-hosting files for Web/Docker, macOS and Windows installers, and Linux x64 AppImage packages.

            macOS installers are signed and notarized. Windows installers are code-signed. All application update packages have updater signatures. Local device execution currently requires macOS.
            See docker/README.md in the self-hosting archive for installation and upgrade instructions. Translations are provided in separate README files.
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}

      - name: Create unsigned manual-download release draft
        id: github_release_candidate
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && needs.preflight.outputs.desktop_policy == 'candidate'
        with:
          name: ${{ github.ref_name }}
          draft: true
          files: |
            sourceweft-selfhost-*.tar.gz
            release-installers/**/*.dmg
            release-installers/**/*.exe
            release-installers/**/*.AppImage
          fail_on_unmatched_files: true
          body: |
            Self-hosting files for Web/Docker, macOS and Windows installers, and Linux x64 AppImage packages.

            Desktop installers in this release are not distribution-signed; the macOS installer is not notarized. macOS and Windows may show unidentified-publisher or unverified-app warnings. Install this version manually. This release does not publish automatic application updates.
            Local device execution currently requires macOS. See docker/README.md in the self-hosting archive for installation and upgrade instructions.
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}

      - name: Upload and verify public downloads
        run: node scripts/ci/publish-downloads.mjs upload
        env:
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}

      - uses: dtolnay/rust-toolchain@1.94.1
        if: needs.preflight.outputs.desktop_policy == 'signed'
      - name: Build update verifier
        if: needs.preflight.outputs.desktop_policy == 'signed'
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Prepare deterministic update notes
        if: needs.preflight.outputs.desktop_policy == 'signed'
        run: node scripts/ci/prepare-update-notes.mjs
      - name: Upload and verify application updates
        if: needs.preflight.outputs.desktop_policy == 'signed'
        run: node scripts/ci/publish-desktop-updates.mjs upload
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.github_release.outputs.id || steps.github_release_candidate.outputs.id }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
            -F prerelease="$RELEASE_PRERELEASE" \
            --jq .html_url

      - name: Promote verified application update channels
        if: needs.preflight.outputs.desktop_policy == 'signed'
        run: node scripts/ci/publish-desktop-updates.mjs promote
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}

      - name: Promote verified download channel
        run: node scripts/ci/publish-downloads.mjs promote
        env:
          DOWNLOADS_S3_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
          DOWNLOADS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: ignore
