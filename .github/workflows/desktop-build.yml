name: Desktop package verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      # Verification-only namespace: deliberately does not match Release's v*.
      - "ci-package-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/ci/desktop-release-artifacts.mjs"
      - "scripts/ci/install-desktop-linux-deps.sh"
      - "scripts/ci/Dockerfile.desktop-linux"
      - "scripts/ci/prepare-desktop-release.mjs"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify tag matches desktop version
        if: github.ref_type == 'tag'
        run: node scripts/ci/verify-desktop-tag.mjs
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop policies and platform boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build verification installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @sourceweft/desktop exec tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
      - name: Describe release installer
        run: node scripts/ci/desktop-release-artifacts.mjs
      # These are verification artifacts, not signed/public release downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.event_name }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-manifest-*.json
          if-no-files-found: error
          retention-days: 14

  linux-sandbox:
    name: Real sandbox suite on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - name: Install sandbox CI dependencies
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep gnome-keyring dbus-x11
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the version the bundle is built with locally (srt requires >= 1.4).
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` job's key so the two jobs never race to save the
          # same cache entry.
          key: desktop-linux-sandbox-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --rg "$(command -v rg)"
      - name: Assert the restricted-userns sysctl is enabled (before setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Install the production bwrap path and its scoped AppArmor profile
        run: |
          set -eu
          sudo install -d /opt/sourceweft/libexec
          sudo install -m 0755 /usr/bin/bwrap /opt/sourceweft/libexec/bwrap
          # Scoped to the production path only: never loosens /usr/bin/bwrap's own profile
          # or the restricted-userns sysctl.
          cat <<'EOF' | sudo tee /etc/apparmor.d/sourceweft-bwrap > /dev/null
          profile sourceweft-bwrap /opt/sourceweft/libexec/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/sourceweft-bwrap
      - name: Assert the restricted-userns sysctl is still enabled (after setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        # hostnames_resolving_to_private_addresses_are_refused asserts these exist: names that
        # resolve to host loopback and to a private address, without depending on live DNS.
        run: |
          set -eu
          printf '127.0.0.1 sw-loop.test\n10.0.0.1 sw-private.test\n' | sudo tee -a /etc/hosts > /dev/null
          getent hosts sw-loop.test sw-private.test
      - name: Pre-build the real-sandbox test binary
        # Compiles (but does not run) before the next step sets a poisoned proxy: cargo
        # itself honours HTTP_PROXY/HTTPS_PROXY for its own crates.io/registry access, and a
        # cold cache would otherwise make that step fail to even compile, not just prove the
        # sidecar strips the variables.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test linux_sandbox --no-run
      - name: Real-sandbox suite (readiness + bwrap execution)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          # Both cases, matching what the sidecar's Command::env_clear strips before
          # spawning bwrap (lowercase set here rather than in `env:`, since GitHub Actions
          # treats env keys as case-insensitive and would reject HTTP_PROXY/http_proxy as
          # duplicates there); this proves neither ever reaches the sandboxed child. The
          # binary was already compiled by the previous step, so this invocation only runs
          # it, never touching cargo's own (now-poisoned) network access.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          # One test at a time: every test starts its own sidecar against the runner's real
          # `~/.cargo` and `~`, and each srt instance creates and removes the placeholder files
          # behind the literal denyRead entries (e.g. `~/.cargo/credentials.toml`), so parallel
          # instances delete each other's placeholders. Production has a single sidecar.
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test linux_sandbox -- --include-ignored --test-threads=1
      - name: Real keyring round trip (fails if it falls back to the no-keyring skip)
        working-directory: apps/desktop/src-tauri
        run: |
          set -u
          set +e
          output=$(dbus-run-session -- sh -c '
            echo -n "throwaway-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --bin sourceweft-desktop secret_store -- --test-threads=1 --nocapture
          ' 2>&1)
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::secret_store tests failed (exit ${status})"
            exit 1
          fi
          # Only the round-trip tests' no-keyring fallback uses this phrase; a different
          # test's expected "a usable Secret Service is present" skip does not match it.
          if echo "${output}" | grep -q "has no usable Secret Service"; then
            echo "::error::secret_store tests fell back to the no-keyring skip path; the real Secret Service round trip never ran"
            exit 1
          fi

  macos-sandbox:
    name: Real sandbox suite on macOS
    # Pinned to macos-14 (arm64) instead of macos-latest: the real suite depends on the
    # runner's Seatbelt behaviour and Xcode/CLT layout, which can change when -latest moves.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Describe the runner (diagnostics for sandbox_apply behaviour)
        run: |
          sw_vers
          uname -m
          xcode-select -p
          if [ -d /Library/Developer/CommandLineTools ]; then
            echo "/Library/Developer/CommandLineTools: present"
          else
            echo "/Library/Developer/CommandLineTools: absent"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the version the bundle is built with locally (srt requires >= 1.4).
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` and `linux-sandbox` keys so the jobs never race to
          # save the same cache entry.
          key: desktop-macos-sandbox-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Install ripgrep (the bundle ships a real rg binary)
        run: |
          set -eu
          brew install ripgrep
          rg_path=$(command -v rg)
          echo "rg: ${rg_path}"
          # The bundle copies this file, so it must be a real arm64 Mach-O executable, not a
          # shell function or a wrapper script.
          file -L "${rg_path}"
          file -L "${rg_path}" | grep -q "Mach-O 64-bit executable arm64"
          "${rg_path}" --version
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --rg "$(command -v rg)"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        # hostname_to_loopback_blocked asserts these exist: names that resolve to host loopback
        # and to a private address, without depending on live DNS.
        run: |
          set -eu
          for entry in '127.0.0.1 sw-loop.test' '10.0.0.1 sw-private.test'; do
            if ! grep -qxF "${entry}" /etc/hosts; then
              echo "${entry}" | sudo tee -a /etc/hosts > /dev/null
            fi
            grep -qxF "${entry}" /etc/hosts
          done
          grep -E 'sw-(loop|private)\.test' /etc/hosts
      - name: Pre-build the real-sandbox test binaries
        # Compiles (but does not run) before the next step sets a poisoned proxy: cargo
        # itself honours HTTP_PROXY/HTTPS_PROXY for its own registry access, and a cold cache
        # would otherwise make that step fail to even compile, not just prove the sidecar
        # strips the variables.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test macos_sandbox --test macos_signing --test local_execution
          --test local_workspaces --test local_binary_reads --no-run
      - name: Real-sandbox suite (readiness, Seatbelt execution, allow-jit signing)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          # Both cases (lowercase set here rather than in `env:`, since GitHub Actions treats
          # env keys as case-insensitive and would reject HTTP_PROXY/http_proxy as
          # duplicates there); this proves neither ever reaches the sandboxed child. The
          # binaries were already compiled by the previous step, so this invocation only runs
          # them. No skip or continue-on-error: a runner that refuses sandbox_apply fails here.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test macos_sandbox --test local_execution \
            --test local_workspaces --test local_binary_reads \
            -- --include-ignored --test-threads=1
          # Signing: only the positive test runs on the hosted VM. The negative test
          # (`bundle_signed_without_allow_jit_loses_jit`) needs a host that enforces the
          # hardened-runtime JIT entitlement; the hosted macos-14 VM does not (run 40186818886:
          # the copy signed without allow-jit still mapped "JS JIT generated code"), so there it
          # would fail for a reason that says nothing about our bundle. It is run locally on
          # real hardware instead (see the macos_signing.rs module doc).
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test macos_signing \
            -- --include-ignored --test-threads=1 --exact \
            bundle_signed_with_allow_jit_runs_with_jit
