name: Desktop package verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      # Verification-only namespace: deliberately does not match Release's v*.
      - "ci-package-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/ci/desktop-release-artifacts.mjs"
      - "scripts/ci/install-desktop-linux-deps.sh"
      - "scripts/ci/Dockerfile.desktop-linux"
      - "scripts/ci/prepare-desktop-release.mjs"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify tag matches desktop version
        if: github.ref_type == 'tag'
        run: node scripts/ci/verify-desktop-tag.mjs
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop policies and platform boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build verification installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @sourceweft/desktop exec tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
      - name: Describe release installer
        run: node scripts/ci/desktop-release-artifacts.mjs
      # These are verification artifacts, not signed/public release downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.event_name }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-manifest-*.json
          if-no-files-found: error
          retention-days: 14
