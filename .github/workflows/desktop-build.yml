name: Desktop package verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      # Verification-only namespace: deliberately does not match Release's v*.
      - "ci-package-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/ci/desktop-release-artifacts.mjs"
      - "scripts/ci/install-desktop-linux-deps.sh"
      - "scripts/ci/Dockerfile.desktop-linux"
      - "scripts/ci/prepare-desktop-release.mjs"
      - "scripts/ci/sandbox-bundle*.mjs"
      - "scripts/ci/update-verifier/**"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify tag matches desktop version
        if: github.ref_type == 'tag'
        run: node scripts/ci/verify-desktop-tag.mjs
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop policies and platform boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build verification installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @sourceweft/desktop exec tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
      - name: Describe release installer
        run: node scripts/ci/desktop-release-artifacts.mjs
      # These are verification artifacts, not signed/public release downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.event_name }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop-manifest-*.json
          if-no-files-found: error
          retention-days: 14

  linux-sandbox:
    name: Real sandbox suite on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - name: Install sandbox CI dependencies
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep gnome-keyring dbus-x11
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the version the bundle is built with locally (srt requires >= 1.4).
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` job's key so the two jobs never race to save the
          # same cache entry.
          key: desktop-linux-sandbox-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --rg "$(command -v rg)"
      - name: Assert the restricted-userns sysctl is enabled (before setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Install the production bwrap path and its scoped AppArmor profile
        # The very script the .deb runs from its maintainer scripts and the AppImage flow runs
        # through pkexec. It scopes the profile to /opt/sourceweft/libexec/bwrap only and never
        # loosens /usr/bin/bwrap's own profile or the restricted-userns sysctl (asserted by the
        # steps before and after).
        run: sudo sh apps/desktop/src-tauri/resources/linux/sourceweft-sandbox-setup.sh install
      - name: Assert the restricted-userns sysctl is still enabled (after setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        # hostnames_resolving_to_private_addresses_are_refused asserts these exist: names that
        # resolve to host loopback and to a private address, without depending on live DNS.
        run: |
          set -eu
          printf '127.0.0.1 sw-loop.test\n10.0.0.1 sw-private.test\n' | sudo tee -a /etc/hosts > /dev/null
          getent hosts sw-loop.test sw-private.test
      - name: Pre-build the real-sandbox test binary
        # Compiles (but does not run) before the next step sets a poisoned proxy: cargo
        # itself honours HTTP_PROXY/HTTPS_PROXY for its own crates.io/registry access, and a
        # cold cache would otherwise make that step fail to even compile, not just prove the
        # sidecar strips the variables.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test linux_sandbox --no-run
      - name: Real-sandbox suite (readiness + bwrap execution)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          # Both cases, matching what the sidecar's Command::env_clear strips before
          # spawning bwrap (lowercase set here rather than in `env:`, since GitHub Actions
          # treats env keys as case-insensitive and would reject HTTP_PROXY/http_proxy as
          # duplicates there); this proves neither ever reaches the sandboxed child. The
          # binary was already compiled by the previous step, so this invocation only runs
          # it, never touching cargo's own (now-poisoned) network access.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          # One test at a time: every test starts its own sidecar against the runner's real
          # `~/.cargo` and `~`, and each srt instance creates and removes the placeholder files
          # behind the literal denyRead entries (e.g. `~/.cargo/credentials.toml`), so parallel
          # instances delete each other's placeholders. Production has a single sidecar.
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test linux_sandbox -- --include-ignored --test-threads=1
      - name: Real keyring round trip (fails if it falls back to the no-keyring skip)
        working-directory: apps/desktop/src-tauri
        run: |
          set -u
          set +e
          output=$(dbus-run-session -- sh -c '
            echo -n "throwaway-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --bin sourceweft-desktop secret_store -- --test-threads=1 --nocapture
          ' 2>&1)
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::secret_store tests failed (exit ${status})"
            exit 1
          fi
          # Only the round-trip tests' no-keyring fallback uses this phrase; a different
          # test's expected "a usable Secret Service is present" skip does not match it.
          if echo "${output}" | grep -q "has no usable Secret Service"; then
            echo "::error::secret_store tests fell back to the no-keyring skip path; the real Secret Service round trip never ran"
            exit 1
          fi

  deb-install:
    name: .deb install and real sandbox suite on Ubuntu 24.04
    # Installs the .deb that `package` built on Ubuntu 22.04 on a stock Ubuntu 24.04 runner
    # (restricted unprivileged user namespaces, AppArmor enforcing) and proves that its
    # maintainer scripts alone give a working scoped bubblewrap, that the system bubblewrap and
    # the sysctl are left alone, and that removing the package undoes everything.
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux verification artifact built by `package`
        uses: actions/download-artifact@v4
        with:
          # The name carries runner.os/arch, the event (or tag) and the commit.
          pattern: desktop-verification-Linux-*-${{ github.sha }}
          path: verification-artifact
          merge-multiple: true
      - name: Locate the .deb
        run: |
          set -eu
          find verification-artifact -type f | sort
          count=$(find verification-artifact -type f -name '*.deb' | wc -l)
          test "${count}" = "1"
          deb=$(find verification-artifact -type f -name '*.deb')
          echo "DEB_PATH=$(realpath "${deb}")" >> "${GITHUB_ENV}"
          echo "DEB_PACKAGE=$(dpkg-deb -f "${deb}" Package)" >> "${GITHUB_ENV}"
          dpkg-deb -I "${deb}"
          dpkg-deb -c "${deb}"
      - name: The package depends on bubblewrap and socat and ships the setup script
        run: |
          set -eu
          depends=$(dpkg-deb -f "${DEB_PATH}" Depends)
          echo "Depends: ${depends}"
          case ",${depends}," in *" bubblewrap"*|*",bubblewrap"*) ;; *) echo "::error::Depends lacks bubblewrap"; exit 1 ;; esac
          case ",${depends}," in *" socat"*|*",socat"*) ;; *) echo "::error::Depends lacks socat"; exit 1 ;; esac
          dpkg-deb -c "${DEB_PATH}" | grep -E ' \./opt/sourceweft/libexec/sourceweft-sandbox-setup$'
          dpkg-deb -c "${DEB_PATH}" | grep -E '^-rwxr-xr-x root/root .* \./opt/sourceweft/libexec/sourceweft-sandbox-setup$'
      - name: Assert the restricted-userns sysctl is enabled (before install)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Record the system bubblewrap (if present) before install
        run: |
          set -eu
          if [ -e /usr/bin/bwrap ]; then
            sha256sum /usr/bin/bwrap | tee "${RUNNER_TEMP}/system-bwrap.sha256"
          else
            echo "no /usr/bin/bwrap before install; the package dependency must provide it"
          fi
      - name: Install the .deb (runs its postinst)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${DEB_PATH}"
      - name: Assert the install result
        run: |
          set -eu
          test -x /opt/sourceweft/libexec/bwrap
          test -f /etc/apparmor.d/sourceweft-bwrap
          cmp /etc/apparmor.d/sourceweft-bwrap - <<'PROFILE'
          profile sourceweft-bwrap /opt/sourceweft/libexec/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          test -x /opt/sourceweft/libexec/sourceweft-sandbox-setup
          cmp /opt/sourceweft/libexec/sourceweft-sandbox-setup apps/desktop/src-tauri/resources/linux/sourceweft-sandbox-setup.sh
          # The scoped bwrap is a byte copy of the system one.
          cmp /opt/sourceweft/libexec/bwrap /usr/bin/bwrap
          # Loaded in the kernel (readable by root only).
          sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^sourceweft-bwrap '
          sudo aa-status | grep -F sourceweft-bwrap || true
          # Neither the sysctl nor the system bubblewrap changed.
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
          if [ -f "${RUNNER_TEMP}/system-bwrap.sha256" ]; then
            sha256sum -c "${RUNNER_TEMP}/system-bwrap.sha256"
          fi
          # dpkg's own check of the bubblewrap package's files: empty output means unchanged.
          verify=$(dpkg --verify bubblewrap)
          test -z "${verify}" || { echo "${verify}"; exit 1; }
      - name: Reinstalling (an upgrade for dpkg) keeps the setup in place
        run: |
          set -eu
          sudo apt-get install -y --reinstall --no-install-recommends "${DEB_PATH}"
          test -x /opt/sourceweft/libexec/bwrap
          test -f /etc/apparmor.d/sourceweft-bwrap
          sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^sourceweft-bwrap '
      - name: Install sandbox CI dependencies
        run: sudo apt-get install -y --no-install-recommends ripgrep gnome-keyring dbus-x11
      - name: Install Linux build dependencies
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the other Linux jobs' keys so no two jobs race to save one entry.
          key: desktop-deb-install-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target x86_64-unknown-linux-gnu --rg "$(command -v rg)"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        run: |
          set -eu
          printf '127.0.0.1 sw-loop.test\n10.0.0.1 sw-private.test\n' | sudo tee -a /etc/hosts > /dev/null
          getent hosts sw-loop.test sw-private.test
      - name: Pre-build the real-sandbox test binary
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test linux_sandbox --no-run
      - name: Real-sandbox suite against the deb-installed bubblewrap and profile
        # No setup script is run in this job: /opt/sourceweft/libexec/bwrap and its AppArmor
        # profile come from the package alone.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test linux_sandbox -- --include-ignored
      - name: Remove the package (runs its prerm)
        run: |
          set -eu
          sudo apt-get remove -y "${DEB_PACKAGE}"
          ! test -e /opt/sourceweft/libexec/bwrap
          ! test -e /opt/sourceweft/libexec/sourceweft-sandbox-setup
          ! test -e /etc/apparmor.d/sourceweft-bwrap
          if sudo grep -E '^sourceweft-bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "::error::the sourceweft-bwrap profile is still loaded after removal"
            exit 1
          fi
          # The system bubblewrap and the sysctl are still untouched.
          test -x /usr/bin/bwrap
          if [ -f "${RUNNER_TEMP}/system-bwrap.sha256" ]; then
            sha256sum -c "${RUNNER_TEMP}/system-bwrap.sha256"
          fi
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"

  sandbox-bundle:
    name: Sandbox bundle pack, sign and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the release build and the real-sandbox job.
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: pnpm install --frozen-lockfile
      - name: Build the signature verifier used for release packages
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Archive tooling unit tests
        run: node --test scripts/ci/sandbox-bundle.test.mjs
      - name: Signing round trip with a throwaway key
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: node --test scripts/ci/sandbox-bundle-signature.test.mjs
      - name: Install the pinned static ripgrep (fails if it is not statically linked)
        id: ripgrep
        run: |
          set -euo pipefail
          rg="$(bash scripts/ci/install-static-ripgrep.sh "$RUNNER_TEMP/ripgrep")"
          echo "path=$rg" >> "$GITHUB_OUTPUT"
          file "$rg"
          # A statically linked binary has no program interpreter (dynamic loader) entry.
          if readelf -lW "$rg" | grep -q INTERP; then
            echo "::error::ripgrep is dynamically linked"
            exit 1
          fi
      - name: Build the sandbox bundle for the release target
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target x86_64-unknown-linux-gnu --rg "${{ steps.ripgrep.outputs.path }}"
      - name: Pack, sign (throwaway key) and verify exactly as the release does
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: |
          set -euo pipefail
          keys=$(mktemp -d)
          pnpm --filter @sourceweft/desktop exec tauri signer generate --ci -w "$keys/ci-key" -p ci-throwaway-password
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$keys/ci-key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-throwaway-password
          export TAURI_UPDATER_PUBLIC_KEY="$(cat "$keys/ci-key.pub")"
          out="$RUNNER_TEMP/sandbox-bundle"
          rm -rf "$out"
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out"
          tarball="$out/sourceweft-sandbox-x86_64-unknown-linux-gnu.tar.gz"
          node scripts/ci/sandbox-bundle.mjs verify "$tarball"
          node scripts/ci/sandbox-bundle.mjs sign "$tarball"
          node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
          tar -tvzf "$tarball"
          # Packing is deterministic: a second pack of the same bundle is byte-identical.
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out-again"
          cmp "$tarball" "$out-again/sourceweft-sandbox-x86_64-unknown-linux-gnu.tar.gz"
