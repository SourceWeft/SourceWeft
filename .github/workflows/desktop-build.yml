name: Desktop package verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      # Verification-only namespace: deliberately does not match Release's v*.
      - "ci-package-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"
      - "scripts/ci/desktop-release-artifacts.mjs"
      - "scripts/ci/install-desktop-linux-deps.sh"
      - "scripts/ci/Dockerfile.desktop-linux"
      - "scripts/ci/prepare-desktop-release.mjs"
      - "scripts/ci/sandbox-bundle*.mjs"
      - "scripts/ci/desktop-deb*.mjs"
      - "scripts/ci/install-static-ripgrep.sh"
      - "scripts/ci/install-ripgrep-macos.sh"
      - "scripts/ci/install-ripgrep-windows.ps1"
      - "scripts/ci/windows-sandbox*.ps1"
      - "scripts/ci/build-sandbox-bundle-windows.sh"
      - "scripts/ci/ripgrep-release.json"
      - "scripts/ci/update-verifier/**"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify tag matches desktop version
        if: github.ref_type == 'tag'
        run: node scripts/ci/verify-desktop-tag.mjs
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop policies and platform boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build verification installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @sourceweft/desktop exec tauri build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
      - name: Describe release installer
        run: node scripts/ci/desktop-release-artifacts.mjs
      # These are verification artifacts, not signed/public release downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_type == 'tag' && github.ref_name || github.event_name }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop-manifest-*.json
          if-no-files-found: error
          retention-days: 14

  linux-sandbox:
    name: Real sandbox suite on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - name: Install sandbox CI dependencies
        run: sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep gnome-keyring dbus-x11
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the version the bundle is built with locally (srt requires >= 1.4).
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` job's key so the two jobs never race to save the
          # same cache entry.
          key: desktop-linux-sandbox-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --rg "$(command -v rg)"
      - name: Assert the restricted-userns sysctl is enabled (before setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Install the production bwrap path and its scoped AppArmor profile
        # The very script the .deb runs from its maintainer scripts and the AppImage flow runs
        # through pkexec. It scopes the profile to /opt/sourceweft/libexec/bwrap only and never
        # loosens /usr/bin/bwrap's own profile or the restricted-userns sysctl (asserted by the
        # steps before and after).
        run: sudo sh apps/desktop/src-tauri/resources/linux/sourceweft-sandbox-setup.sh install
      - name: Assert the restricted-userns sysctl is still enabled (after setup)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        # hostnames_resolving_to_private_addresses_are_refused asserts these exist: names that
        # resolve to host loopback and to a private address, without depending on live DNS.
        run: |
          set -eu
          printf '127.0.0.1 sw-loop.test\n10.0.0.1 sw-private.test\n' | sudo tee -a /etc/hosts > /dev/null
          getent hosts sw-loop.test sw-private.test
      - name: Pre-build the real-sandbox test binary
        # Compiles (but does not run) before the next step sets a poisoned proxy: cargo
        # itself honours HTTP_PROXY/HTTPS_PROXY for its own crates.io/registry access, and a
        # cold cache would otherwise make that step fail to even compile, not just prove the
        # sidecar strips the variables.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test linux_sandbox --no-run
      - name: Real-sandbox suite (readiness + bwrap execution)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          # Both cases, matching what the sidecar's Command::env_clear strips before
          # spawning bwrap (lowercase set here rather than in `env:`, since GitHub Actions
          # treats env keys as case-insensitive and would reject HTTP_PROXY/http_proxy as
          # duplicates there); this proves neither ever reaches the sandboxed child. The
          # binary was already compiled by the previous step, so this invocation only runs
          # it, never touching cargo's own (now-poisoned) network access.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          # One test at a time: every test starts its own sidecar against the runner's real
          # `~/.cargo` and `~`, and each srt instance creates and removes the placeholder files
          # behind the literal denyRead entries (e.g. `~/.cargo/credentials.toml`), so parallel
          # instances delete each other's placeholders. Production has a single sidecar.
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test linux_sandbox -- --include-ignored --test-threads=1
      - name: Real keyring round trip (fails if it falls back to the no-keyring skip)
        working-directory: apps/desktop/src-tauri
        run: |
          set -u
          set +e
          output=$(dbus-run-session -- sh -c '
            echo -n "throwaway-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --bin sourceweft-desktop secret_store -- --test-threads=1 --nocapture
          ' 2>&1)
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::secret_store tests failed (exit ${status})"
            exit 1
          fi
          # Only the round-trip tests' no-keyring fallback uses this phrase; a different
          # test's expected "a usable Secret Service is present" skip does not match it.
          if echo "${output}" | grep -q "has no usable Secret Service"; then
            echo "::error::secret_store tests fell back to the no-keyring skip path; the real Secret Service round trip never ran"
            exit 1
          fi

  deb-install:
    name: .deb install and real sandbox suite on Ubuntu 24.04
    # Installs the .deb that `package` built on Ubuntu 22.04 on a stock Ubuntu 24.04 runner
    # (restricted unprivileged user namespaces, AppArmor enforcing) and proves that its
    # maintainer scripts alone give a working scoped bubblewrap, that the system bubblewrap and
    # the sysctl are left alone, and that removing the package undoes everything.
    # GitHub `needs` cannot target one matrix leg, so this waits for the whole `package` matrix.
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux verification artifact built by `package`
        uses: actions/download-artifact@v4
        with:
          # The name carries runner.os/arch, the event (or tag) and the commit.
          pattern: desktop-verification-Linux-*-${{ github.sha }}
          path: verification-artifact
          merge-multiple: true
      - name: Locate the .deb
        run: |
          set -eu
          find verification-artifact -type f | sort
          count=$(find verification-artifact -type f -name '*.deb' | wc -l)
          test "${count}" = "1"
          deb=$(find verification-artifact -type f -name '*.deb')
          echo "DEB_PATH=$(realpath "${deb}")" >> "${GITHUB_ENV}"
          echo "DEB_PACKAGE=$(dpkg-deb -f "${deb}" Package)" >> "${GITHUB_ENV}"
          dpkg-deb -I "${deb}"
          dpkg-deb -c "${deb}"
      - name: The package depends on bubblewrap and socat and ships the setup script
        run: |
          set -eu
          depends=$(dpkg-deb -f "${DEB_PATH}" Depends)
          echo "Depends: ${depends}"
          case ",${depends}," in *" bubblewrap"*|*",bubblewrap"*) ;; *) echo "::error::Depends lacks bubblewrap"; exit 1 ;; esac
          case ",${depends}," in *" socat"*|*",socat"*) ;; *) echo "::error::Depends lacks socat"; exit 1 ;; esac
          dpkg-deb -c "${DEB_PATH}" | grep -E ' (\./)?opt/sourceweft/libexec/sourceweft-sandbox-setup$'
          # Tauri writes numeric owner 0/0 without names (and no leading ./); dpkg installs both as root.
          dpkg-deb -c "${DEB_PATH}" | grep -E '^-rwxr-xr-x (root/root|0/0) .* (\./)?opt/sourceweft/libexec/sourceweft-sandbox-setup$'
      - name: Assert the restricted-userns sysctl is enabled (before install)
        run: |
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
      - name: Record the system bubblewrap (if present) before install
        run: |
          set -eu
          if [ -e /usr/bin/bwrap ]; then
            sha256sum /usr/bin/bwrap | tee "${RUNNER_TEMP}/system-bwrap.sha256"
          else
            echo "no /usr/bin/bwrap before install; the package dependency must provide it"
          fi
      - name: Install the .deb (runs its postinst)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${DEB_PATH}"
      - name: Assert the install result
        run: |
          set -eu
          test -x /opt/sourceweft/libexec/bwrap
          test -f /etc/apparmor.d/sourceweft-bwrap
          cmp /etc/apparmor.d/sourceweft-bwrap - <<'PROFILE'
          profile sourceweft-bwrap /opt/sourceweft/libexec/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          test -x /opt/sourceweft/libexec/sourceweft-sandbox-setup
          cmp /opt/sourceweft/libexec/sourceweft-sandbox-setup apps/desktop/src-tauri/resources/linux/sourceweft-sandbox-setup.sh
          # The scoped bwrap is a byte copy of the system one.
          cmp /opt/sourceweft/libexec/bwrap /usr/bin/bwrap
          # Loaded in the kernel (readable by root only).
          sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^sourceweft-bwrap '
          sudo aa-status | grep -F sourceweft-bwrap || true
          # Neither the sysctl nor the system bubblewrap changed.
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"
          if [ -f "${RUNNER_TEMP}/system-bwrap.sha256" ]; then
            sha256sum -c "${RUNNER_TEMP}/system-bwrap.sha256"
          fi
          # dpkg's own check of the bubblewrap package's files: empty output means unchanged.
          verify=$(dpkg --verify bubblewrap)
          test -z "${verify}" || { echo "${verify}"; exit 1; }
      - name: Reinstalling (an upgrade for dpkg) keeps the setup in place
        run: |
          set -eu
          sudo apt-get install -y --reinstall --no-install-recommends "${DEB_PATH}"
          test -x /opt/sourceweft/libexec/bwrap
          test -f /etc/apparmor.d/sourceweft-bwrap
          sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^sourceweft-bwrap '
      - name: Install sandbox CI dependencies
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install Linux build dependencies
        run: sudo bash scripts/ci/install-desktop-linux-deps.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the other Linux jobs' keys so no two jobs race to save one entry.
          key: desktop-deb-install-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target x86_64-unknown-linux-gnu --rg "$(command -v rg)"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        run: |
          set -eu
          printf '127.0.0.1 sw-loop.test\n10.0.0.1 sw-private.test\n' | sudo tee -a /etc/hosts > /dev/null
          getent hosts sw-loop.test sw-private.test
      - name: Pre-build the real-sandbox test binary
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test linux_sandbox --no-run
      - name: Real-sandbox suite against the deb-installed bubblewrap and profile
        # No setup script is run in this job: /opt/sourceweft/libexec/bwrap and its AppArmor
        # profile come from the package alone.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          # One test at a time, as in the linux-sandbox job: parallel sidecars share the runner's
          # real `~/.cargo` and delete each other's denyRead placeholder files.
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test linux_sandbox -- --include-ignored --test-threads=1
      - name: Remove the package (runs its prerm)
        run: |
          set -eu
          sudo apt-get remove -y "${DEB_PACKAGE}"
          # `test ! -e`, not `! test -e`: bash -e ignores a failed negated command.
          test ! -e /opt/sourceweft/libexec/bwrap
          test ! -e /opt/sourceweft/libexec/sourceweft-sandbox-setup
          test ! -e /etc/apparmor.d/sourceweft-bwrap
          if sudo grep -E '^sourceweft-bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "::error::the sourceweft-bwrap profile is still loaded after removal"
            exit 1
          fi
          # The system bubblewrap and the sysctl are still untouched.
          test -x /usr/bin/bwrap
          if [ -f "${RUNNER_TEMP}/system-bwrap.sha256" ]; then
            sha256sum -c "${RUNNER_TEMP}/system-bwrap.sha256"
          fi
          value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=${value}"
          test "${value}" = "1"

  sandbox-bundle:
    name: Sandbox bundle pack, sign and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the release build and the real-sandbox job.
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: pnpm install --frozen-lockfile
      - name: Build the signature verifier used for release packages
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Archive tooling unit tests
        run: node --test scripts/ci/sandbox-bundle.test.mjs
      - name: Signing round trip with a throwaway key
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: node --test scripts/ci/sandbox-bundle-signature.test.mjs
      - name: Install the pinned static ripgrep (fails if it is not statically linked)
        id: ripgrep
        run: |
          set -euo pipefail
          rg="$(bash scripts/ci/install-static-ripgrep.sh "$RUNNER_TEMP/ripgrep")"
          echo "path=$rg" >> "$GITHUB_OUTPUT"
          file "$rg"
          # A statically linked binary has no program interpreter (dynamic loader) entry.
          if readelf -lW "$rg" | grep -q INTERP; then
            echo "::error::ripgrep is dynamically linked"
            exit 1
          fi
      - name: Build the sandbox bundle for the release target
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target x86_64-unknown-linux-gnu --rg "${{ steps.ripgrep.outputs.path }}"
      - name: Pack, sign (throwaway key) and verify exactly as the release does
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: |
          set -euo pipefail
          keys=$(mktemp -d)
          pnpm --filter @sourceweft/desktop exec tauri signer generate --ci -w "$keys/ci-key" -p ci-throwaway-password
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$keys/ci-key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-throwaway-password
          export TAURI_UPDATER_PUBLIC_KEY="$(cat "$keys/ci-key.pub")"
          out="$RUNNER_TEMP/sandbox-bundle"
          rm -rf "$out"
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out"
          tarball="$out/sourceweft-sandbox-x86_64-unknown-linux-gnu.tar.gz"
          node scripts/ci/sandbox-bundle.mjs verify "$tarball"
          node scripts/ci/sandbox-bundle.mjs sign "$tarball"
          node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
          tar -tvzf "$tarball"
          # Packing is deterministic: a second pack of the same bundle is byte-identical.
          node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out-again"
          cmp "$tarball" "$out-again/sourceweft-sandbox-x86_64-unknown-linux-gnu.tar.gz"

  sandbox-bundle-macos:
    name: Sandbox bundle pack, sign and verify (macOS)
    # macos-14 (arm64), like the real-sandbox macOS job: the arm64 bundle builds natively and the
    # x86_64 bundle cross-compiles here exactly as the Tauri installers do on macos-15.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the release build and the real-sandbox jobs.
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: pnpm install --frozen-lockfile
      - name: Build the signature verifier used for release packages
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Archive tooling unit tests (darwin file set, cross-arch target resolution)
        run: node --test scripts/ci/sandbox-bundle.test.mjs
      - name: Sidecar manifest unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Signing round trip with a throwaway key
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: node --test scripts/ci/sandbox-bundle-signature.test.mjs
      - name: Build, ad-hoc sign, pack and verify both macOS targets exactly as the release does
        env:
          DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier
        run: |
          set -euo pipefail
          # One throwaway updater key for the minisign round trip (no release secret is used).
          keys=$(mktemp -d)
          pnpm --filter @sourceweft/desktop exec tauri signer generate --ci -w "$keys/ci-key" -p ci-throwaway-password
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$keys/ci-key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-throwaway-password
          export TAURI_UPDATER_PUBLIC_KEY="$(cat "$keys/ci-key.pub")"
          # The arm64 target builds natively; the x86_64 target cross-compiles on this arm64
          # runner (bun --target=bun-darwin-x64) and is packed but not executed.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::$target"
            rg="$(bash scripts/ci/install-ripgrep-macos.sh "$RUNNER_TEMP/ripgrep-$target" "$target")"
            pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target "$target" --rg "$rg"
            # Ad-hoc sign (hardened runtime + allow-jit entitlement) BEFORE packing, then rebuild
            # the manifest over the signed binaries so their hashes match what is packed.
            bash apps/desktop/sandbox-sidecar/scripts/sign-macos.sh apps/desktop/sandbox-sidecar/dist/bundle -
            codesign --verify --strict --verbose=2 apps/desktop/sandbox-sidecar/dist/bundle/srt-sidecar
            codesign --verify --strict --verbose=2 apps/desktop/sandbox-sidecar/dist/bundle/rg
            pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --remanifest
            out="$RUNNER_TEMP/sandbox-bundle-$target"
            rm -rf "$out" "$out-again"
            node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out"
            tarball="$out/sourceweft-sandbox-$target.tar.gz"
            node scripts/ci/sandbox-bundle.mjs verify "$tarball"
            node scripts/ci/sandbox-bundle.mjs sign "$tarball"
            node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
            tar -tvzf "$tarball"
            # Packing is deterministic: a second pack of the same signed bundle is byte-identical.
            node scripts/ci/sandbox-bundle.mjs pack apps/desktop/sandbox-sidecar/dist/bundle "$out-again"
            cmp "$tarball" "$out-again/sourceweft-sandbox-$target.tar.gz"
            echo "::endgroup::"
          done

  sandbox-bundle-windows:
    name: Sandbox bundle pack, sign and verify (Windows ${{ matrix.arch }})
    # Each architecture builds natively on its own runner (so the compiled executables are also
    # run, not just packed): windows-2025 for x86_64 and windows-11-arm for aarch64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE_DIR: apps/desktop/sandbox-sidecar/dist/bundle
      DESKTOP_UPDATE_VERIFIER: scripts/ci/update-verifier/target/release/sourceweft-update-verifier.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the release build and the real-sandbox jobs. Bun ships a native
          # windows-aarch64 build from 1.3.10 on (bun-v1.4.2 has bun-windows-aarch64.zip), which
          # setup-bun v2 selects on the arm64 runner.
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: pnpm install --frozen-lockfile
      - name: Build the signature verifier used for release packages
        run: cargo build --locked --release --manifest-path scripts/ci/update-verifier/Cargo.toml
      - name: Archive tooling unit tests (the Windows file set and Windows host handling)
        # Only the Windows-specific cases: the Linux and macOS file sets rely on file-system exec
        # bits a Windows file system does not have, and their jobs run the whole file.
        run: node --test --test-name-pattern="[Ww]indows" scripts/ci/sandbox-bundle.test.mjs
      - name: Sidecar build helper and manifest unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar exec tsx --test tests/build-helpers.test.ts tests/bundle-manifest.test.ts
      - name: Install the pinned ripgrep (checksum and architecture verified)
        id: ripgrep
        shell: pwsh
        run: |
          $rg = @(& ./scripts/ci/install-ripgrep-windows.ps1 "$env:RUNNER_TEMP\ripgrep" $env:TARGET)[-1]
          # Forward slashes: `pnpm run` re-escapes every backslash in the arguments it appends to
          # the script on Windows (D:\a\_temp became D:\\a\\_temp for bun), so the path handed to
          # `build -- --rg` must not contain any. Windows accepts this form everywhere.
          "path=$($rg.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
      - name: Build the sandbox bundle for the target
        shell: bash
        env:
          RG_PATH: ${{ steps.ripgrep.outputs.path }}
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target "$TARGET" --rg "$RG_PATH"
      - name: Verify the built executables (architecture, namespaced srt-win, sidecar namespace)
        # Runs the compiled srt-sidecar.exe with --print-namespace: the --define that build.ts
        # passes through the Windows command line must really have reached the executable.
        shell: pwsh
        run: ./apps/desktop/sandbox-sidecar/scripts/verify-windows-bundle.ps1 $env:BUNDLE_DIR $env:TARGET
      - name: Authenticode-sign with a throwaway certificate, re-verify and re-manifest
        # The release signs the three executables before packing; this proves signing leaves them
        # runnable (a Bun-compiled executable must still print its namespace) and that the bundle
        # can be re-manifested over the signed bytes. The certificate is self-signed and created
        # for this run, so no production certificate or secret is involved.
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=SourceWeft CI throwaway' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          try {
            ./apps/desktop/sandbox-sidecar/scripts/sign-windows.ps1 -BundleDir $env:BUNDLE_DIR -Thumbprint $cert.Thumbprint -Throwaway
            ./apps/desktop/sandbox-sidecar/scripts/verify-windows-bundle.ps1 $env:BUNDLE_DIR $env:TARGET
          }
          finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
      - name: Re-manifest over the signed executables
        # bash, not pwsh: in PowerShell `pnpm` can resolve to pnpm.ps1, which swallows the `--`.
        shell: bash
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --remanifest
      - name: Pack, sign (throwaway key) and verify exactly as the release does
        shell: bash
        run: |
          set -euo pipefail
          # cygpath -m: a D:/... path, no backslashes for pnpm to re-escape.
          keys="$(cygpath -m "$RUNNER_TEMP")/sandbox-bundle-keys"
          mkdir -p "$keys"
          pnpm --filter @sourceweft/desktop exec tauri signer generate --ci -w "$keys/ci-key" -p ci-throwaway-password
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$keys/ci-key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-throwaway-password
          export TAURI_UPDATER_PUBLIC_KEY="$(cat "$keys/ci-key.pub")"
          # Relative output paths: GNU tar reads `D:\...` as a remote host:file.
          out=sandbox-bundle-ci
          rm -rf "$out" "$out-again"
          node scripts/ci/sandbox-bundle.mjs pack "$BUNDLE_DIR" "$out"
          tarball="$out/sourceweft-sandbox-$TARGET.tar.gz"
          node scripts/ci/sandbox-bundle.mjs verify "$tarball"
          node scripts/ci/sandbox-bundle.mjs sign "$tarball"
          node scripts/ci/sandbox-bundle.mjs verify-signature "$tarball"
          tar -tvzf "$tarball"
          # Packing is deterministic: a second pack of the same signed bundle is byte-identical.
          node scripts/ci/sandbox-bundle.mjs pack "$BUNDLE_DIR" "$out-again"
          cmp "$tarball" "$out-again/sourceweft-sandbox-$TARGET.tar.gz"

  windows-sandbox:
    name: Real sandbox suite on Windows (${{ matrix.arch }})
    # The namespaced srt-win on the two Windows architectures, each on its own native runner:
    # the elevated setup through the app's real launcher, then execution, the file-system and
    # network fences, process-tree kill and coexistence with an upstream default install. The
    # runner account is an administrator with UAC consent disabled, so `Start-Process -Verb RunAs`
    # completes without a prompt: this proves the launcher, NOT a human answering a UAC prompt
    # (that is checked by hand, see apps/desktop/WINDOWS_SANDBOX.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # bash, not pwsh: in PowerShell `pnpm` can resolve to pnpm.ps1, which swallows the `--`.
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE_DIR: apps/desktop/sandbox-sidecar/dist/bundle
      UPSTREAM_DIR: apps/desktop/sandbox-sidecar/dist/upstream-srt
      SUITE: apps/desktop/src-tauri/tests/windows_sandbox.rs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as the bundle jobs and the release build.
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` job's key so the jobs never race to save one entry.
          key: desktop-windows-sandbox-${{ matrix.target }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests (the platform-independent files)
        # The fake-srt server tests use POSIX shell stubs and run on the other platforms' jobs.
        run: >-
          pnpm --filter @sourceweft/desktop-sandbox-sidecar exec tsx --test
          tests/address-guard.test.ts tests/address-guard-parity.test.ts
          tests/build-helpers.test.ts tests/bundle-manifest.test.ts
          tests/policy-win32.test.ts tests/print-namespace.test.ts
      - name: Install the pinned ripgrep (checksum and architecture verified)
        id: ripgrep
        shell: pwsh
        run: |
          $rg = @(& ./scripts/ci/install-ripgrep-windows.ps1 "$env:RUNNER_TEMP\ripgrep" $env:TARGET)[-1]
          # Forward slashes: `pnpm run` re-escapes every backslash in the arguments it appends.
          "path=$($rg.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
      - name: Build the sandbox bundle for the target
        env:
          RG_PATH: ${{ steps.ripgrep.outputs.path }}
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target "$TARGET" --rg "$RG_PATH"
      - name: Verify the built executables (architecture, namespaced srt-win, sidecar namespace)
        shell: pwsh
        run: ./apps/desktop/sandbox-sidecar/scripts/verify-windows-bundle.ps1 $env:BUNDLE_DIR $env:TARGET
      - name: Preflight (administrator, Start-Process -Verb RunAs without a prompt, Node and Git facts)
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 preflight
      - name: Install the UPSTREAM default sandbox-runtime first (its own account, rules and ports)
        # Coexistence is part of the contract: the namespaced build must neither read nor change an
        # upstream default install. The suite compares the upstream status before and after.
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 install-upstream -UpstreamDir $env:UPSTREAM_DIR -Version 0.0.81
      - name: Add the hosts-file entries the proxy hostname tests require
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 hosts
      - name: Detect Git Bash
        id: git
        shell: pwsh
        run: |
          $present = Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
          "bash=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Git Bash present: $present"
      - name: Pre-build the real-sandbox test binary
        # Compiles (but does not run) before the next step poisons the proxy variables: cargo
        # itself honours them for its own registry access.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test windows_sandbox --no-run
      - name: Real-sandbox suite (setup through the real launcher, execution, fences, kill, coexistence)
        env:
          # Windows environment variable names are case-insensitive, so these are also the lowercase
          # variables; the suite fails when they are missing and proves the sidecar strips them.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          set -euo pipefail
          # One test at a time: the tests install and remove machine-wide state and each starts its
          # own sidecars on the installed port range. --nocapture so SKIPPED lines are visible.
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test windows_sandbox -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/suite-main.log"
      - name: Guard - every test ran and none skipped on a machine that has what it needs
        env:
          GIT_BASH: ${{ steps.git.outputs.bash }}
        run: |
          set -eu
          log="$RUNNER_TEMP/suite-main.log"
          expected=$(grep -c '^#\[test\]' "$SUITE")
          passed=$(grep -E '^test result: ok\. [0-9]+ passed' "$log" | tail -1 | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          echo "tests in the file: ${expected}; passed: ${passed:-none}"
          if [ -z "${passed}" ] || [ "${passed}" -lt "${expected}" ]; then
            echo "::error::only ${passed:-0} of ${expected} real-sandbox tests ran; a filter or a skip path swallowed the real run"
            exit 1
          fi
          if grep -q 'SKIPPED' "$log" && [ "${GIT_BASH}" = "true" ]; then
            grep 'SKIPPED' "$log"
            echo "::error::a test skipped itself although Git for Windows is installed on this runner"
            exit 1
          fi
      - name: Hide Git Bash so the host chooses Windows PowerShell
        if: steps.git.outputs.bash == 'true'
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 hide-bash
      - name: Shell-matrix tests again under Windows PowerShell
        if: steps.git.outputs.bash == 'true'
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test windows_sandbox -- --include-ignored --test-threads=1 --nocapture shells_ 2>&1 | tee "$RUNNER_TEMP/suite-powershell.log"
          expected=$(grep -c '^fn shells_' "$SUITE")
          passed=$(grep -E '^test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/suite-powershell.log" | tail -1 | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          echo "shell-matrix tests in the file: ${expected}; passed: ${passed:-none}"
          if [ -z "${passed}" ] || [ "${passed}" -lt "${expected}" ]; then
            echo "::error::only ${passed:-0} of ${expected} shell-matrix tests ran under PowerShell"
            exit 1
          fi
      - name: Restore Git Bash
        if: always() && steps.git.outputs.bash == 'true'
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 restore-bash
      - name: Both installs are still present, distinct, and the upstream one is unchanged
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 assert-coexist -UpstreamDir $env:UPSTREAM_DIR
      - name: Real Credential Manager round trip (fails if it falls back to the no-store skip)
        working-directory: apps/desktop/src-tauri
        run: |
          set -u
          set +e
          output=$(cargo test --locked --bin sourceweft-desktop secret_store -- --test-threads=1 --nocapture 2>&1)
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::secret_store tests failed (exit ${status})"
            exit 1
          fi
          # Only the round-trip tests' no-store fallback uses this phrase.
          if echo "${output}" | grep -q "has no usable Credential Manager"; then
            echo "::error::secret_store tests fell back to the no-store skip path; the real Credential Manager round trip never ran"
            exit 1
          fi
      - name: Uninstall ours, check the upstream install is untouched, uninstall upstream
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 final-uninstall -UpstreamDir $env:UPSTREAM_DIR
      - name: Collect the setup result file
        if: always()
        shell: pwsh
        run: |
          $result = Join-Path (Join-Path $(if ($env:ProgramW6432) { $env:ProgramW6432 } else { $env:ProgramFiles }) 'SourceWeft') 'sandbox-setup-result.json'
          if (Test-Path -LiteralPath $result) { Copy-Item -LiteralPath $result -Destination "$env:RUNNER_TEMP\sandbox-setup-result.json" }
      - name: Cleanup (uninstall what is left, restore Git Bash, remove the hosts entries)
        if: always()
        shell: pwsh
        run: ./scripts/ci/windows-sandbox-coexist.ps1 cleanup -UpstreamDir $env:UPSTREAM_DIR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sandbox-logs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/suite-*.log
            ${{ runner.temp }}/sandbox-setup-result.json
          if-no-files-found: ignore
          retention-days: 7

  macos-sandbox:
    name: Real sandbox suite on macOS
    # Pinned to macos-14 (arm64) instead of macos-latest: the real suite depends on the
    # runner's Seatbelt behaviour and Xcode/CLT layout, which can change when -latest moves.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Describe the runner (diagnostics for sandbox_apply behaviour)
        run: |
          sw_vers
          uname -m
          xcode-select -p
          if [ -d /Library/Developer/CommandLineTools ]; then
            echo "/Library/Developer/CommandLineTools: present"
          else
            echo "/Library/Developer/CommandLineTools: absent"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the version the bundle is built with locally (srt requires >= 1.4).
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          # Distinct from the `package` and `linux-sandbox` keys so the jobs never race to
          # save the same cache entry.
          key: desktop-macos-sandbox-${{ runner.arch }}-1.94.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Install ripgrep (the bundle ships a real rg binary)
        run: |
          set -eu
          brew install ripgrep
          rg_path=$(command -v rg)
          echo "rg: ${rg_path}"
          # The bundle copies this file, so it must be a real arm64 Mach-O executable, not a
          # shell function or a wrapper script.
          file -L "${rg_path}"
          file -L "${rg_path}" | grep -q "Mach-O 64-bit executable arm64"
          "${rg_path}" --version
      - run: pnpm install --frozen-lockfile
      - name: Sandbox sidecar unit tests
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar test
      - name: Build sandbox sidecar bundle
        run: pnpm --filter @sourceweft/desktop-sandbox-sidecar build -- --target aarch64-apple-darwin --rg "$(command -v rg)"
      - name: Add the /etc/hosts entries the proxy hostname tests require
        # hostname_to_loopback_blocked asserts these exist: names that resolve to host loopback
        # and to a private address, without depending on live DNS.
        run: |
          set -eu
          for entry in '127.0.0.1 sw-loop.test' '10.0.0.1 sw-private.test'; do
            if ! grep -qxF "${entry}" /etc/hosts; then
              echo "${entry}" | sudo tee -a /etc/hosts > /dev/null
            fi
            grep -qxF "${entry}" /etc/hosts
          done
          grep -E 'sw-(loop|private)\.test' /etc/hosts
      - name: Pre-build the real-sandbox test binaries
        # Compiles (but does not run) before the next step sets a poisoned proxy: cargo
        # itself honours HTTP_PROXY/HTTPS_PROXY for its own registry access, and a cold cache
        # would otherwise make that step fail to even compile, not just prove the sidecar
        # strips the variables.
        run: >-
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test macos_sandbox --test macos_signing --test local_execution
          --test local_workspaces --test local_binary_reads --no-run
      - name: Real-sandbox suite (readiness, Seatbelt execution, allow-jit signing)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          # Both cases (lowercase set here rather than in `env:`, since GitHub Actions treats
          # env keys as case-insensitive and would reject HTTP_PROXY/http_proxy as
          # duplicates there); this proves neither ever reaches the sandboxed child. The
          # binaries were already compiled by the previous step, so this invocation only runs
          # them. No skip or continue-on-error: a runner that refuses sandbox_apply fails here.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test macos_sandbox --test local_execution \
            --test local_workspaces --test local_binary_reads \
            -- --include-ignored --test-threads=1
          # Signing: only the positive test runs on the hosted VM. The negative test
          # (`bundle_signed_without_allow_jit_loses_jit`) needs a host that enforces the
          # hardened-runtime JIT entitlement; the hosted macos-14 VM does not (run 40186818886:
          # the copy signed without allow-jit still mapped "JS JIT generated code"), so there it
          # would fail for a reason that says nothing about our bundle. It is run locally on
          # real hardware instead (see the macos_signing.rs module doc).
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --test macos_signing \
            -- --include-ignored --test-threads=1 --exact \
            bundle_signed_with_allow_jit_runs_with_jit
