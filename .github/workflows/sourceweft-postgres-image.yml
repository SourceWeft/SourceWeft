name: sourceweft-postgres Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Base image tag to publish"
        required: true
        default: "17"
      release:
        description: "Optional immutable release tag, for example 17-20260520.1"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: sourceweft-postgres-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish sourceweft-postgres
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sourceweft-postgres" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}-${{ matrix.suffix }}
            type=raw,value=${{ inputs.release }}-${{ matrix.suffix }},enable=${{ inputs.release != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sourceweft-postgres/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sourceweft-postgres-${{ matrix.suffix }}
          cache-to: type=gha,scope=sourceweft-postgres-${{ matrix.suffix }},mode=max
          build-args: |
            SOURCEWEFT_POSTGRES_RELEASE=${{ inputs.release || inputs.tag }}
            PG_TEXTSEARCH_REF=023c3841b7d41fd3dbdbaa6f48ef3da46c9a362b
            PGVECTOR_VERSION=0.8.2
            AGE_VERSION=1.7.0
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sourceweft-postgres" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:${{ inputs.tag }}" \
            "${{ steps.image.outputs.name }}:${{ inputs.tag }}-amd64" \
            "${{ steps.image.outputs.name }}:${{ inputs.tag }}-arm64"

          if [ -n "${{ inputs.release }}" ]; then
            docker buildx imagetools create \
              -t "${{ steps.image.outputs.name }}:${{ inputs.release }}" \
              "${{ steps.image.outputs.name }}:${{ inputs.release }}-amd64" \
              "${{ steps.image.outputs.name }}:${{ inputs.release }}-arm64"
          fi
