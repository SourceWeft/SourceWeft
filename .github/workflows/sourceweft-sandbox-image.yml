name: Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/sourceweft-sandbox/**'
  schedule:
    # Monthly rebuild to pick up base OS security patches and
    # refreshed package indices.  03:00 UTC on the 1st.
    - cron: '0 3 1 * *'
  workflow_dispatch:

# An explicit permissions block zeroes every scope it does not name, so
# contents: read must be spelled out or actions/checkout gets "Repository
# not found" on this private repo (the failure mode of every run before
# 2026-08-06).
permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and publish sandbox image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sourceweft-sandbox
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=schedule,pattern={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/sourceweft-sandbox
          push: true
          # SourceWeft sandbox is deployed on linux/amd64 Dayonta clusters.
          # Add linux/arm64 here if you run Daytona on Apple Silicon hosts.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
